/* =====================================================

/* =====================================================

}


.mesaj-ilan-alt {

}


/* =====================================================

===================================================== */

.mesaj-ilan-ok {

/* =====================================================
   BOŞ MESAJ
===================================================== */

.mesaj-bos {

}


.mesaj-bos i {

    font-size: 45px;

}


/* =====================================================
   SOHBET EKRANI
===================================================== */

.sohbet-ekrani {

    position: fixed;

    inset: 0;

    background: #f5f5f5;

    z-index: 10000;

    overflow: hidden;
}


/* =====================================================
   ÜST ALAN
===================================================== */

    display: flex;

/* =====================================================

===================================================== */

.sohbet-geri::before {

/* =====================================================

}

    width: 100%;

===================================================== */

===================================================== */

/* =====================================================

===================================================== */

<body>


<!-- =====================================================
     MESAJLAR ANA SAYFA
===================================================== -->

<div class="mesajlar-container">


    <div class="mesajlar-header">

        <i class="fa-solid fa-comments"></i>

    </div>


    <div id="mesajIlanListesi"
         class="mesaj-ilan-listesi">


        <div class="mesaj-bos">

            <i class="fa-regular fa-comment-dots"></i>

            <div>
                Henüz mesajınız yok.
            </div>

        </div>


    </div>

</div>



<!-- =====================================================
     SOHBET
===================================================== -->

<div id="sohbetEkrani"
     class="sohbet-ekrani">


    <!-- =================================================
         ÜST ALAN
    ================================================== -->

    <div class="sohbet-header">


        <!-- GERİ -->

        <div class="sohbet-geri"
             onclick="sohbetKapat()">

            <i class="fa-solid fa-arrow-left"></i>

        </div>


        <!-- FIREBASE'DEN GELECEK İRTİBAT -->

        <div id="sohbetIrtibat"
             class="sohbet-irtibat">

            İrtibat

        </div>


        <!-- ... -->

        <div class="sohbet-islemler"
             onclick="islemPanelAc()">

            <i class="fa-solid fa-ellipsis"></i>

        </div>


    </div>



    <!-- =================================================
         İLAN ÖN İZLEME
    ================================================== -->

    <div class="sohbet-ilan-onizleme">


        <img id="sohbetIlanResim"
             class="sohbet-ilan-resim"
             src="">


        <div class="sohbet-ilan-bilgi">


            <div id="sohbetIlanBaslik"
                 class="sohbet-ilan-baslik">
            </div>


            <div id="sohbetIlanAlt"
                 class="sohbet-ilan-alt">
            </div>


        </div>


    </div>



    <!-- =================================================
         MESAJLAR
    ================================================== -->

    <div id="sohbetMesajlar"
         class="sohbet-mesajlar">
    </div>



    <!-- =================================================
         MESAJ GÖNDER
    ================================================== -->

    <div class="mesaj-gonder-panel">


        <input
            id="mesajInput"
            class="mesaj-input"
            type="text"
            placeholder="Mesajınızı yazın..."
        >


        <button
            class="mesaj-gonder"
            onclick="mesajGonder()">

            <i class="fa-solid fa-paper-plane"></i>

        </button>


    </div>


</div>



<!-- =====================================================
     KARARTMA
===================================================== -->

<div id="islemKarartma"
     class="islem-karartma"
     onclick="islemPanelKapat()">
</div>



<!-- =====================================================
     İŞLEMLER PANELİ
===================================================== -->

<div id="islemPanel"
     class="islem-panel">


    <!-- SÜRÜKLEME ÇİZGİSİ -->

    <div id="islemSurukmeCizgisi"
         class="islem-surukme-cizgisi">
    </div>


    <!-- BAŞLIK -->

    <div class="islem-baslik">

        İşlemler

    </div>


    <!-- ÇİZGİ -->

    <div class="islem-ayirici">
    </div>


    <!-- MESAJI SİL -->

    <button
        class="mesaj-sil"
        onclick="mesajSil()">

        <i class="fa-regular fa-trash-can"></i>

        <span>
            Mesajı sil
        </span>

    </button>


</div>



<script>


/* =====================================================
   URL
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const gelenIlanID =
    urlParams.get("ilan");


let aktifIlan = null;



/* =====================================================
   İLANI BUL
===================================================== */

if (
    gelenIlanID &&
    typeof ilanlarVerisi !== "undefined"
) {

    aktifIlan =
        ilanlarVerisi.find(

            ilan =>
                String(ilan.id) ===
                String(gelenIlanID)

        );

}


console.log(
    "GELEN İLAN ID:",
    gelenIlanID
);


console.log(
    "AKTİF İLAN:",
    aktifIlan
);



/* =====================================================
   İLAN BULUNDUYSA
===================================================== */

if (aktifIlan) {


    /* İLAN RESMİ */

    const resim =

        aktifIlan.resimler &&
        aktifIlan.resimler.length > 0

            ? aktifIlan.resimler[0]

            : "";


    document.getElementById(
        "sohbetIlanResim"
    ).src = resim;



    /* =================================================
       BAŞLIK
    ================================================= */


    let kartBaslik = "";


    kartBaslik +=
        aktifIlan.baslik || "";



    /* DURUM */

    if (
        aktifIlan.durum ===
        "satilik"
    ) {

        kartBaslik +=
            " SATILIK";

    }

    else if (
        aktifIlan.durum ===
        "kiralik"
    ) {

        kartBaslik +=
            " KİRALIK";

    }

    else if (
        aktifIlan.durum ===
        "kat-karsiligi"
    ) {

        kartBaslik +=
            " KAT KARŞILIĞI";

    }



    /* DAİRE */

    if (
        aktifIlan.konutSekli &&

        aktifIlan.konutSekli
            .toLowerCase() ===
            "daire"
    ) {

        kartBaslik +=
            " Daire";

    }



    /* DÜKKAN */

    else if (
        aktifIlan.konutTipi &&

        aktifIlan.konutTipi
            .toLowerCase() ===
            "dükkan"
    ) {

        kartBaslik +=
            " Dükkan";

    }



    /* VİLLA */

    else if (

        (
            aktifIlan.konutTipi &&

            aktifIlan.konutTipi
                .toLowerCase() ===
                "villa"
        )

        ||

        (
            aktifIlan.konutSekli &&

            aktifIlan.konutSekli
                .toLowerCase() ===
                "villa"
        )

    ) {

        kartBaslik +=
            " Villa";

    }



    /* ARSA / TARLA */

    else if (
        aktifIlan.tip &&

        (
            aktifIlan.tip
                .toLowerCase() ===
                "arsa"

            ||

            aktifIlan.tip
                .toLowerCase() ===
                "tarla"
        )
    ) {

        kartBaslik +=
            " " +

            aktifIlan.tip
                .charAt(0)
                .toUpperCase() +

            aktifIlan.tip
                .slice(1)
                .toLowerCase();

    }



    /* SADECE DAİREDE ODA SAYISI */

    if (
        aktifIlan.konutSekli &&

        aktifIlan.konutSekli
            .toLowerCase() ===
            "daire" &&

        aktifIlan["Oda Sayısı"]
    ) {

        kartBaslik +=
            " " +
            aktifIlan["Oda Sayısı"];

    }



    /* BAŞLIK */

    document.getElementById(
        "sohbetIlanBaslik"
    ).textContent =
        kartBaslik;



    /* =================================================
       FİYAT
    ================================================= */

    document.getElementById(
        "sohbetIlanAlt"
    ).textContent =

        aktifIlan.fiyat

            ? aktifIlan.fiyat +
              " " +
              (aktifIlan.paraBirimi || "")

            : "";



    /* =================================================
       İRTİBAT
       
       Firebase'den gerçek değer geldiğinde
       burası doldurulacak.
    ================================================= */

    if (aktifIlan.irtibat) {

        document.getElementById(
            "sohbetIrtibat"
        ).textContent =
            aktifIlan.irtibat;

    }



    /* =================================================
       SOHBETİ AÇ
    ================================================= */

    document.getElementById(
        "sohbetEkrani"
    ).style.display =
        "block";

}



/* =====================================================
   SOHBET KAPAT
===================================================== */

function sohbetKapat() {

    islemPanelKapat();


    document.getElementById(
        "sohbetEkrani"
    ).style.display =
        "none";

}



/* =====================================================
   İŞLEM PANELİ AÇ
===================================================== */

function islemPanelAc() {

    const panel =
        document.getElementById(
            "islemPanel"
        );


    const karartma =
        document.getElementById(
            "islemKarartma"
        );


    panel.classList.add("acik");

    karartma.classList.add("acik");

}



/* =====================================================
   İŞLEM PANELİ KAPAT
===================================================== */

function islemPanelKapat() {

    const panel =
        document.getElementById(
            "islemPanel"
        );


    const karartma =
        document.getElementById(
            "islemKarartma"
        );


    panel.classList.remove("acik");

    karartma.classList.remove("acik");


    /* Sürükleme sırasında verilen inline
       transform değerini temizle */

    panel.style.transform = "";

}



/* =====================================================
   MESAJI SİL
===================================================== */

function mesajSil() {

    console.log(
        "MESAJI SİL TIKLANDI"
    );


    islemPanelKapat();


    /*
       GERÇEK FIREBASE SİLME İŞLEMİNİ
       BİR SONRAKİ ADIMDA BAĞLAYACAĞIZ.
    */

}



/* =====================================================
   MESAJ GÖNDER
===================================================== */

function mesajGonder() {

    const input =
        document.getElementById(
            "mesajInput"
        );


    const mesaj =
        input.value.trim();


    if (!mesaj)
        return;


    console.log(
        "Gönderilecek mesaj:",
        mesaj
    );


    input.value = "";

}



/* =====================================================
   PANEL SÜRÜKLEME
===================================================== */

const islemPanel =
    document.getElementById(
        "islemPanel"
    );


const islemSurukmeCizgisi =
    document.getElementById(
        "islemSurukmeCizgisi"
    );


let panelBaslangicY = 0;

let panelMevcutY = 0;

let panelSurukleniyor = false;



/* =====================================================
   TOUCH START
===================================================== */

islemSurukmeCizgisi.addEventListener(
    "touchstart",
    function(e) {

        if (!islemPanel.classList.contains("acik"))
            return;


        panelSurukleniyor = true;


        panelBaslangicY =
            e.touches[0].clientY;


        panelMevcutY =
            panelBaslangicY;


        islemPanel.style.transition =
            "none";

    },
    {
        passive: true
    }
);



/* =====================================================
   TOUCH MOVE
===================================================== */

islemSurukmeCizgisi.addEventListener(
    "touchmove",
    function(e) {

        if (!panelSurukleniyor)
            return;


        panelMevcutY =
            e.touches[0].clientY;


        let fark =
            panelMevcutY -
            panelBaslangicY;


        /* Sadece aşağı sürüklemeye izin ver */

        if (fark < 0)
            fark = 0;


        islemPanel.style.transform =
            `translate(-50%, ${fark}px)`;

    },
    {
        passive: true
    }
);



/* =====================================================
   TOUCH END
===================================================== */

islemSurukmeCizgisi.addEventListener(
    "touchend",
    function() {

        if (!panelSurukleniyor)
            return;


        panelSurukleniyor = false;


        const fark =
            panelMevcutY -
            panelBaslangicY;


        islemPanel.style.transition =
            "transform .25s ease";


        /* Yeterince aşağı çekildiyse kapat */

        if (fark >= 70) {

            islemPanel.style.transform =
                "translate(-50%, 100%)";


            setTimeout(
                function() {

                    islemPanel.classList.remove(
                        "acik"
                    );


                    document
                        .getElementById(
                            "islemKarartma"
                        )
                        .classList.remove(
                            "acik"
                        );


                    islemPanel.style.transform =
                        "";

                },
                250
            );

        }

        /* Yeterince çekilmediyse geri getir */

        else {

            islemPanel.style.transform =
                "translate(-50%, 0)";

        }


        panelBaslangicY = 0;

        panelMevcutY = 0;

    },
    {
        passive: true
    }
);

</script>
