<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Mesajlarım - NETmax Gayrimenkul</title>


<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<script src="js/ilanlar.js"></script>


<style>

/* =====================================================
   GENEL
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    background: #f2f4f7;

    font-family:
        'Titillium Web',
        Arial,
        sans-serif;

    color: #222;
}


/* =====================================================
   ANA KAPSÜL
===================================================== */

.mesajlar-container {

    width: 100%;

    max-width: 600px;

    min-height: 100vh;

    margin: auto;

    background: #ffffff;

    position: relative;
}


/* =====================================================
   MESAJLARIM BAŞLIK
===================================================== */

.mesajlar-header {

    height: 60px;

    display: flex;

    align-items: center;

    padding: 0 15px;

    background: #ffffff;

    border-bottom: 1px solid #e5e7eb;

    font-size: 20px;

    font-weight: normal;
}

.mesajlar-header i {

    margin-right: 12px;

    color: #2563eb;
}


/* =====================================================
   İLAN LİSTESİ
===================================================== */

.mesaj-ilan-listesi {

    width: 100%;
}


/* =====================================================
   İLAN SATIRI
===================================================== */

.mesaj-ilan {

    width: 100%;

    min-height: 85px;

    display: flex;

    align-items: center;

    padding: 10px 15px;

    border-bottom: 1px solid #eeeeee;

    cursor: pointer;

    background: #ffffff;
}

.mesaj-ilan:hover {

    background: #f8fafc;
}


/* =====================================================
   İLAN RESMİ
===================================================== */

.mesaj-ilan-resim {

    width: 65px;

    height: 65px;

    border-radius: 8px;

    object-fit: cover;

    flex-shrink: 0;
}


/* =====================================================
   İLAN BİLGİ
===================================================== */

.mesaj-ilan-bilgi {

    flex: 1;

    min-width: 0;

    margin-left: 12px;
}

.mesaj-ilan-baslik {

    font-size: 16px;

    font-weight: normal;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.mesaj-ilan-alt {

    font-size: 14px;

    color: #777;

    margin-top: 3px;
}

.mesaj-ilan-sayi {
    font-size: 12px;
    color: #777;
    margin-top: 3px;
}


/* =====================================================
   SAĞ OK
===================================================== */

.mesaj-ilan-ok {

    margin-left: 10px;

    color: #999;

    font-size: 18px;
}


/* =====================================================
   BOŞ MESAJ
===================================================== */

.mesaj-bos {

    padding: 50px 20px;

    text-align: center;

    color: #888;
}

.mesaj-bos i {

    font-size: 45px;

    margin-bottom: 15px;
}


/* =====================================================
   SOHBET EKRANI
===================================================== */

.sohbet-ekrani {

    display: none;

    position: fixed;

    inset: 0;

    background: #f2f4f7;

    z-index: 10000;
}


/* =====================================================
   SOHBET ÜST ALAN
===================================================== */

.sohbet-header {

    width: 100%;

    max-width: 600px;

    margin: auto;

    height: 68px;

    display: flex;

    align-items: center;

    padding: 6px 10px;

    background: #1a365d;

    border-bottom: 1px solid #dddddd;

    position: relative;
}


/* =====================================================
   GERİ < BUTONU
===================================================== */

.sohbet-geri {

    width: 42px;

    height: 52px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 31px;

    font-weight: normal;

    cursor: pointer;

    flex-shrink: 0;
}

.sohbet-geri i {

    font-size: 26px;
}


/* =====================================================
   İRTİBAT ALANI
===================================================== */

.sohbet-irtibat {

    flex: 1;

    min-width: 0;

    height: 52px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding-left: 0;

    overflow: hidden;
}

.sohbet-irtibat-baslik {

    font-size: 13px;

    color: #ffffff;

    font-weight: normal;
}

.sohbet-irtibat-no {

    font-size: 15px;

    color: #ffffff;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    font-weight: normal;
}


/* =====================================================
   ÜÇ NOKTA
===================================================== */

.sohbet-islem-buton {

    width: 44px;

    height: 52px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 22px;

    color: #ffffff;

    cursor: pointer;

    flex-shrink: 0;
}


/* =====================================================
   İŞLEM PANELİ — ALTTAN AÇILAN
===================================================== */

.islem-panel {

    display: none;

    position: fixed;

    z-index: 12000;

    left: 50%;

    bottom: 0;

    transform:
        translate(-50%, 100%);

    width: 100%;

    max-width: 600px;

    height: 220px;

    background: #ffffff;

    border-top: 1px solid #d8d8d8;

    border-radius:
        16px 16px 0 0;

    box-shadow:
        0 -5px 20px rgba(0,0,0,.12);

    transition:
        transform .25s ease;

    overflow-y: auto;
}


.islem-panel.islem-panel-acik {

    transform:
        translate(-50%, 0);

}


/* =====================================================
   ÜST ÇİZGİ / TUTMA ALANI
===================================================== */

.islem-tutamac {

    height: 36px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: grab;

    touch-action: none;

}


.islem-tutamac-cizgi {

    width: 42px;

    height: 4px;

    border-radius: 10px;

    background: #cfcfcf;

}


/* =====================================================
   İŞLEMLER BAŞLIĞI
===================================================== */

.islem-baslik {

    padding: 10px 18px;

    font-size: 15px;

    color: #777;

    font-weight: normal;

    border-bottom: 1px solid #eeeeee;

}


/* =====================================================
   MESAJI SİL
===================================================== */

.islem-sil {

    width: 100%;

    min-height: 48px;

    display: flex;

    align-items: center;

    padding: 0 18px;

    background: #ffffff;

    border: none;

    font-family: inherit;

    font-size: 15px;

    color: #333;

    text-align: left;

    cursor: pointer;
}

.islem-sil:hover {

    background: #f7f7f7;
}

.islem-sil i {

    margin-right: 10px;

    color: #777;
}


/* =====================================================
   İLAN ÖN İZLEME ALANI
===================================================== */

.sohbet-ilan-onizleme {

    width: 100%;

    max-width: 600px;

    margin: 0 auto;

    background: #ffffff;

    border-bottom: 1px solid #dddddd;

    padding: 12px;
}


/* =====================================================
   ÖN İZLEME KARTI
===================================================== */

.sohbet-ilan-kart {

    width: 100%;

    min-height: 92px;

    display: flex;

    align-items: center;

    background: #ffffff;

    border: 1px solid #e3e3e3;

    border-radius: 8px;

    overflow: hidden;
}


/* =====================================================
   ÖN İZLEME RESMİ
===================================================== */

.sohbet-ilan-kart-resim {

    width: 92px;

    height: 92px;

    object-fit: cover;

    flex-shrink: 0;
}


/* =====================================================
   ÖN İZLEME BİLGİ
===================================================== */

.sohbet-ilan-kart-bilgi {

    min-width: 0;

    flex: 1;

    padding: 10px 12px;
}

.sohbet-ilan-kart-baslik {

    font-size: 15px;

    line-height: 1.35;

    color: #222;

    font-weight: normal;

    display: -webkit-box;

    -webkit-line-clamp: 3;

    -webkit-box-orient: vertical;

    overflow: hidden;
}

.sohbet-ilan-kart-fiyat {

    margin-top: 6px;

    font-size: 14px;

    color: #777;

    font-weight: normal;
}


/* =====================================================
   MESAJ ALANI
===================================================== */

.sohbet-mesajlar {

    width: 100%;

    max-width: 600px;

    margin: auto;

    height:
        calc(100vh - 68px - 117px - 60px);

    overflow-y: auto;

    padding: 15px 12px 20px;
}


/* =====================================================
   MESAJ BALONU
===================================================== */

.mesaj-balonu {

    max-width: 78%;

    padding: 5px 8px;

    border-radius: 10px;

    margin-bottom: 9px;

    font-size: 15px;

    line-height: 1.3;

    font-weight: normal;

    word-wrap: break-word;

    position: relative;
}


/* =====================================================
   GELEN MESAJ — SOLDA
===================================================== */

.mesaj-gelen {

    background: #ffffff;

    color: #222222;

    margin-right: auto;

    margin-left: 0;

    border: 1px solid #eeeeee;

    border-bottom-left-radius: 0;

}


/* =====================================================
   SOL ALT ÇIKINTI
   Balonun altından direkt devam eder
===================================================== */

.mesaj-gelen::after {

    content: "";

    position: absolute;

    left: -1px;

    bottom: -7px;

    width: 8px;

    height: 8px;

    background: #ffffff;

    border-left: 1px solid #eeeeee;

    border-bottom: 1px solid #eeeeee;

    clip-path: polygon(
        0 0,
        100% 0,
        0 100%
    );

}


/* =====================================================
   GİDEN MESAJ — SAĞDA
===================================================== */

.mesaj-giden {

    background: #bff4b0;

    color: #222222;

    margin-left: auto;

    margin-right: 0;

    border-bottom-right-radius: 0;

}


/* =====================================================
   SAĞ ALT ÇIKINTI
   Balonun altından direkt devam eder
===================================================== */

.mesaj-giden::after {

    content: "";

    position: absolute;

    right: -1px;

    bottom: -7px;

    width: 8px;

    height: 8px;

    background: #bff4b0;

    clip-path: polygon(
        0 0,
        100% 0,
        100% 100%
    );

}


/* =====================================================
   SAAT
===================================================== */

.mesaj-saat {

    display: inline-block;

    font-size: 10px;

    margin-top: 2px;

    opacity: .65;

    text-align: right;

    font-weight: normal;
}


.mesaj-tik {

    display: inline-block;

    font-size: 11px;

    margin-left: 5px;

    color: #777;

    letter-spacing: -2px;

}


.mesaj-tik.mesaj-okundu {

    color: #1683ff;

}

/* =====================================================
   MESAJ GÖNDER PANELİ
===================================================== */

.mesaj-gonder-panel {

    position: fixed;

    bottom: 0;

    left: 50%;

    transform: translateX(-50%);

    width: 100%;

    max-width: 600px;

    height: 60px;

    background: #ffffff;

    border-top: 1px solid #dddddd;

    display: flex;

    align-items: center;

    padding: 8px 10px;

    z-index: 11000;
}


.mesaj-input {

    flex: 1;

    height: 42px;

    border: 1px solid #dddddd;

    border-radius: 21px;

    padding: 0 15px;

    font-family: inherit;

    font-size: 15px;

    outline: none;

    font-weight: normal;
}

.mesaj-input:focus {

    border-color: #2563eb;
}


/* GÖNDER */

.mesaj-gonder {

    width: 42px;

    height: 42px;

    margin-left: 8px;

    border: none;

    border-radius: 50%;

    background: #2563eb;

    color: white;

    font-size: 17px;

    cursor: pointer;

    flex-shrink: 0;
}


/* =====================================================
   YÖNETİCİ GİRİŞ EKRANI
===================================================== */

.mesaj-giris-ekrani {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 20000;

    background: #f2f4f7;

    align-items: center;

    justify-content: center;

    padding: 20px;
}


.mesaj-giris-kutu {

    width: 100%;

    max-width: 380px;

    background: #ffffff;

    border-radius: 12px;

    padding: 25px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.12);
}


.mesaj-giris-baslik {

    font-size: 21px;

    text-align: center;

    margin-bottom: 22px;

    font-weight: normal;
}


.mesaj-giris-input {

    width: 100%;

    height: 44px;

    margin-bottom: 12px;

    border: 1px solid #dddddd;

    border-radius: 7px;

    padding: 0 13px;

    font-family: inherit;

    font-size: 15px;

    outline: none;
}


.mesaj-giris-buton {

    width: 100%;

    height: 44px;

    border: none;

    border-radius: 7px;

    background: #2563eb;

    color: white;

    font-family: inherit;

    font-size: 15px;

    cursor: pointer;
}


/* =====================================================
   YÜKLENİYOR
===================================================== */

.mesaj-yukleniyor {

    padding: 40px 20px;

    text-align: center;

    color: #777;

    font-size: 14px;
}


/* =====================================================
   MOBİL
===================================================== */

@media (max-width: 600px) {

    body {

        background: #ffffff;
    }

    .mesajlar-container {

        width: 100%;

        max-width: none;

        min-height: 100dvh;
    }


    .mesajlar-header {

        height: 56px;

        padding: 0 14px;

        font-size: 18px;
    }


    .mesaj-ilan {

        min-height: 78px;

        padding: 8px 12px;
    }


    .mesaj-ilan-resim {

        width: 58px;

        height: 58px;

        border-radius: 7px;
    }


    .mesaj-ilan-bilgi {

        margin-left: 10px;
    }


    .mesaj-ilan-baslik {

        font-size: 15px;
    }


    .mesaj-ilan-alt {

        font-size: 13px;
    }


    .mesaj-ilan-ok {

        font-size: 16px;

        margin-left: 7px;
    }


    .sohbet-header {

        max-width: none;

        height: 62px;

        padding: 5px 6px;
    }


    .sohbet-geri {

        width: 40px;

        font-size: 28px;
    }


    .sohbet-irtibat {

        height: 50px;
    }


    .sohbet-irtibat-baslik {

        font-size: 12px;
    }


    .sohbet-irtibat-no {

        font-size: 14px;
    }


    .sohbet-islem-buton {

        width: 42px;

        height: 50px;
    }


    .islem-panel {

        top: 62px;

        max-width: none;
    }


    .sohbet-ilan-onizleme {

        max-width: none;

        padding: 10px;
    }


    .sohbet-ilan-kart {

        min-height: 98px;
    }


    .sohbet-ilan-kart-resim {

        width: 98px;

        height: 98px;
    }


    .sohbet-ilan-kart-baslik {

        font-size: 14px;

        -webkit-line-clamp: 3;
    }


    .sohbet-ilan-kart-fiyat {

        font-size: 13px;
    }


    .sohbet-mesajlar {

        max-width: none;

        height:
            calc(100dvh - 62px - 118px - 60px);

        padding: 12px;
    }


    .mesaj-balonu {

        max-width: 82%;

        font-size: 14px;
    }


    .mesaj-gonder-panel {

        max-width: none;

        height: 60px;

        padding: 8px;
    }


    .mesaj-input {

        height: 42px;

        font-size: 14px;
    }


    .mesaj-gonder {

        width: 42px;

        height: 42px;
    }

}



</style>

</head>


<body>


<!-- =====================================================
     YÖNETİCİ GİRİŞ
===================================================== -->

<div id="mesajGirisEkrani"
     class="mesaj-giris-ekrani">

    <div class="mesaj-giris-kutu">

        <div class="mesaj-giris-baslik">
            Mesajlarım
        </div>

        <input
            id="mesajEmail"
            class="mesaj-giris-input"
            type="email"
            placeholder="E-posta">

        <input
            id="mesajSifre"
            class="mesaj-giris-input"
            type="password"
            placeholder="Şifre">

        <button
            class="mesaj-giris-buton"
            onclick="mesajlarGirisYap()">

            Giriş Yap

        </button>

    </div>

</div>


<!-- =====================================================
     MESAJLAR LİSTESİ
===================================================== -->

<div class="mesajlar-container"
     id="mesajlarContainer"
     style="display:none;">

    <div class="mesajlar-header">

        <i class="fa-solid fa-comments"></i>

        Mesajlarım

    </div>


    <div id="mesajIlanListesi"
         class="mesaj-ilan-listesi">

        <div class="mesaj-yukleniyor">

            Mesajlar yükleniyor...

        </div>

    </div>

</div>


<!-- =====================================================
     ZİYARETÇİ SOHBET EKRANI
===================================================== -->

<div id="sohbetEkrani"
     class="sohbet-ekrani">


    <!-- ÜST ALAN -->

    <div class="sohbet-header">


        <!-- GERİ -->

        <div class="sohbet-geri"
             onclick="sohbetKapat()">

            <i class="fa-solid fa-angle-left" style="color:#ffffff;"></i>

        </div>


        <!-- İRTİBAT -->

        <div class="sohbet-irtibat">

            <div class="sohbet-irtibat-baslik">
                İrtibat
            </div>

            <div id="sohbetIrtibatNo"
                 class="sohbet-irtibat-no">

                Bağlanıyor...

            </div>

        </div>


        <!-- ÜÇ NOKTA -->

        <div class="sohbet-islem-buton"
             onclick="islemPanelAc()">

            <i class="fa-solid fa-ellipsis"></i>

        </div>

    </div>


    <!-- =================================================
         İŞLEM PANELİ
    ================================================= -->

    <div id="islemPanel"
         class="islem-panel">


        <div class="islem-tutamac"
           id="islemTutamac">

            <div class="islem-tutamac-cizgi"></div>

        </div>


        <div class="islem-baslik">

            İşlemler

        </div>


        <button id="mesajSilButonu"
                    class="islem-sil"
                    onclick="mesajlariSil()">
            
                <i class="fa-regular fa-trash-can"></i>
            
                Mesajı sil
            
         </button>

    </div>


    <!-- =================================================
         İLAN ÖN İZLEME
    ================================================= -->

    <div class="sohbet-ilan-onizleme">

        <div class="sohbet-ilan-kart">


            <img id="sohbetIlanResim"
                 class="sohbet-ilan-kart-resim"
                 src=""
                 alt="">


            <div class="sohbet-ilan-kart-bilgi">

                <div id="sohbetIlanBaslik"
                     class="sohbet-ilan-kart-baslik">
                </div>


                <div id="sohbetIlanFiyat"
                     class="sohbet-ilan-kart-fiyat">
                </div>

            </div>

        </div>

    </div>


    <!-- =================================================
         MESAJLAR
    ================================================= -->

    <div id="sohbetMesajlar"
         class="sohbet-mesajlar">

    </div>


    <!-- =================================================
         MESAJ YAZ
    ================================================= -->

    <div class="mesaj-gonder-panel">

        <input
            id="mesajInput"
            class="mesaj-input"
            type="text"
            placeholder="Mesajınızı yazın...">

        <button
            class="mesaj-gonder"
            onclick="mesajGonder()">

            <i class="fa-solid fa-arrow-right"></i>

        </button>

    </div>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
    getAuth,
    signInAnonymously,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
    getDatabase,
    ref,
    push,
    set,
    onValue,
    remove,
    get,
    update
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";



/* =====================================================
   FIREBASE AYARLARI
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBVMw9NS3R49xqnVLgmlAiSvTtYXFrHwB0",

    authDomain:
        "netmax-mesajlar.firebaseapp.com",

    databaseURL:
        "https://netmax-mesajlar-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "netmax-mesajlar",

    storageBucket:
        "netmax-mesajlar.firebasestorage.app",

    messagingSenderId:
        "575038344835",

    appId:
        "1:575038344835:web:513417e69f4a291dc095b6"
};


/* =====================================================
   FIREBASE BAŞLAT
===================================================== */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const mevcutKullanici =
    auth.currentUser;

console.log(
    "SAYFA AÇILIŞINDA FIREBASE KULLANICISI:",
    mevcutKullanici
);


const database =
    getDatabase(app);


/* =====================================================
   URL
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const gelenIlanID =
    urlParams.get("ilan");

const ziyaretciModu =
    urlParams.get("ziyaretci") === "true";


/* =====================================================
   GLOBAL
===================================================== */

let aktifIlan = null;

let aktifMesajlar = {};

let ziyaretciUID = null;

let mesajDinleyiciDurdur = null;


/* =====================================================
   İLANI BUL
===================================================== */

if (
    gelenIlanID &&
    typeof ilanlarVerisi !== "undefined"
) {

    aktifIlan =
        ilanlarVerisi.find(

            ilan =>
                String(ilan.id) ===
                String(gelenIlanID)

        );

}


/* =====================================================
   İLAN BAŞLIĞI OLUŞTUR
===================================================== */

function ilanBasligiOlustur(ilan) {

    if (!ilan) return "";


    let kartBaslik = "";


    kartBaslik +=
        ilan.baslik || "";


    /* DURUM */

    if (ilan.durum === "satilik") {

        kartBaslik +=
            " SATILIK";

    }

    else if (ilan.durum === "kiralik") {

        kartBaslik +=
            " KİRALIK";

    }

    else if (
        ilan.durum === "kat-karsiligi"
    ) {

        kartBaslik +=
            " KAT KARŞILIĞI";

    }


    /* DAİRE */

    if (
        ilan.konutSekli &&
        ilan.konutSekli
            .toLowerCase() === "daire"
    ) {

        kartBaslik +=
            " Daire";

    }


    /* DÜKKAN */

    else if (
        ilan.konutTipi &&
        ilan.konutTipi
            .toLowerCase() === "dükkan"
    ) {

        kartBaslik +=
            " Dükkan";

    }


    /* VİLLA */

    else if (

        (
            ilan.konutTipi &&
            ilan.konutTipi
                .toLowerCase() === "villa"
        )

        ||

        (
            ilan.konutSekli &&
            ilan.konutSekli
                .toLowerCase() === "villa"
        )

    ) {

        kartBaslik +=
            " Villa";

    }


    /* ARSA / TARLA */

    else if (

        ilan.tip &&

        (
            ilan.tip.toLowerCase() === "arsa" ||

            ilan.tip.toLowerCase() === "tarla"
        )

    ) {

        kartBaslik +=
            " " +
            ilan.tip.charAt(0)
                .toUpperCase() +
            ilan.tip.slice(1)
                .toLowerCase();

    }


    /* ODA SAYISI */

    if (

        ilan.konutSekli &&

        ilan.konutSekli
            .toLowerCase() === "daire" &&

        ilan["Oda Sayısı"]

    ) {

        kartBaslik +=
            " " +
            ilan["Oda Sayısı"];

    }


    return kartBaslik;
}

window.mesajGonder =
async function () {

    const input =
        document.getElementById(
            "mesajInput"
        );


    const mesaj =
        input.value.trim();


    if (!mesaj) return;


    if (!ziyaretciUID) {

        );

        return;

    }


    if (!gelenIlanID) {

        alert(
            "İlan bulunamadı."
        );

        return;

    }


    try {

        const mesajRef =
            ref(
                database,
                "mesajlar/" +
                gelenIlanID
            );


        const yeniMesaj =
            push(mesajRef);


        await set(
                yeniMesaj,
                {
            
                    mesaj:
                        mesaj,
            
                    uid:
                        ziyaretciUID,
            
                    alici:
                        window.yoneticiModu === true
                            ? "ziyaretci"
                            : "yonetici",
            
                    zaman:
                        Date.now(),
            
                    okundu:
                        false
            
                }
            );


        input.value = "";


        console.log(
            "MESAJ FIREBASE'E KAYDEDİLDİ"
        );


    }

    catch (error) {

        console.error(
            "MESAJ KAYIT HATASI:",
            error
        );


        alert(
            "Mesaj gönderilemedi."
        );

    }

};

            console.error(

                      ).length;
                      
                  console.log(

                    ) return;


                    mesajListesi.sort(

                    );

                      mesajListesi
                          .filter(
                              mesaj =>

                          )
                          .sort(

                Yönetici UID'sini geçici olarak
                kullanıyoruz.

                mesajlariDinle() Firebase'den
                sohbeti dinleyecek.
                */

                ziyaretciUID =
                    user.uid;

                  window.yoneticiModu = true;

                /*
                Yönetici olduğunu göster
                */

                document
                    .getElementById(
                        "sohbetIrtibatNo"
                    )
                    .textContent =
                        "Yönetici";


                /*
                Mesajları dinle
                */

                mesajlariDinle();


                return;

            }


            /*
            =================================================
            YÖNETİCİ MESAJ LİSTESİ
            URL'de ?ilan YOK
            =================================================
            */

            document
                .getElementById(
                    "mesajGirisEkrani"
                )
                .style.display =
                    "none";


            document
                .getElementById(
                    "mesajlarContainer"
                )
                .style.display =
                    "block";


            /*
            Firebase'den mesajları yükle
            */

            yoneticiMesajlariniYukle();


            return;

        }


        /*
        =================================================
        ZİYARETÇİ MODU
        URL'de ?ilan varsa
        =================================================
        */
        window.yoneticiModu = false;
          
        if (gelenIlanID) {


            
           if (ziyaretciModu) {

          try {
      
              if (user && !user.isAnonymous) {
      
                  await signOut(auth);
      
              }
      
      
              const sonuc =
                  await signInAnonymously(
                      auth
                  );
      
      
              ziyaretciUID =
                  sonuc.user.uid;
      
      
              window.yoneticiModu =
                  false;
      
      
              console.log(
                  "ZİYARETÇİ MODU:"
              );
      
      
              console.log(
                  "ZİYARETÇİ UID:",
                  ziyaretciUID
              );
      
          }
      
          catch (error) {
      
              console.error(
                  "ZİYARETÇİ GİRİŞ HATASI:",
                  error
              );
      
      
              alert(
                  "Firebase bağlantısı kurulamadı."
              );
      
      
              return;
      
          }
      
      }

            /*
            =================================================
            ZİYARETÇİ SİL BUTONU
            =================================================

            Ziyaretçi hiçbir şekilde
            sil butonunu göremez.
            =================================================
            */

            const mesajSilButonu =
                document.getElementById(
                    "mesajSilButonu"
                );


            if (mesajSilButonu) {

                mesajSilButonu.style.display =
                    "none";

            }


            /*
            =================================================
            ZİYARETÇİ UID
            =================================================
            */

            console.log(
                "ZİYARETÇİ UID:",
                ziyaretciUID
            );


            /*
            İrtibat alanında UID göster
            */

            document
                .getElementById(
                    "sohbetIrtibatNo"
                )
                .textContent =
                    ziyaretciUID;


            /*
            Sohbet ekranını aç
            */

            ziyaretciSohbetiniAc();


            /*
            Firebase mesajlarını dinle
            */

            mesajlariDinle();


            return;

        }


        /*
        =================================================
        ANONİM OTURUM VARSA
        YÖNETİCİ SAYFASINDA KABUL ETME
        =================================================
        */

        if (
            user &&
            user.isAnonymous
        ) {

            try {

                await signOut(
                    auth
                );

            }

            catch (error) {

                console.error(
                    "ANONİM ÇIKIŞ HATASI:",
                    error
                );

            }

        }


        /*
        =================================================
        GİRİŞ EKRANI
        =================================================
        */

        document
            .getElementById(
                "mesajGirisEkrani"
            )
            .style.display =
                "flex";


        document
            .getElementById(
                "mesajlarContainer"
            )
            .style.display =
                "none";

    });


/* =====================================================
   GERİ TUŞU / BF CACHE
===================================================== */

window.addEventListener(
    "pageshow",
    function (event) {

        if (event.persisted) {

            console.log(
                "SAYFA GERİDEN GELDİ — YENİDEN YÜKLENİYOR"
            );


            location.reload();

        }

    }
);

/* =====================================================
   ENTER İLE GÖNDER
===================================================== */

document
    .getElementById(
        "mesajInput"
    )
    .addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                mesajGonder();

            }

        }
    );


/* =====================================================
   İŞLEM PANELİ — AŞAĞI SÜRÜKLEME
===================================================== */

const islemPanel =
    document.getElementById("islemPanel");

const islemTutamac =
    document.getElementById("islemTutamac");


let panelBaslangicY =
    0;

let panelHareketY =
    0;

let panelSurukleniyor =
    false;


/* =====================================================
   PANELİ AÇ
===================================================== */

window.islemPanelAc =
function () {

    islemPanel.style.display =
        "block";

    islemPanel.style.transform =
        "translateX(-50%) translateY(0)";

};


/* =====================================================
   PANELİ KAPAT
===================================================== */

window.islemPanelKapat =
function () {

    islemPanel.style.transform =
        "translateX(-50%) translateY(100%)";

    setTimeout(
        function () {

            islemPanel.style.display =
                "none";

            islemPanel.style.transform =
                "translateX(-50%)";

        },
        250
    );

};


/* =====================================================
   SÜRÜKLEME BAŞLANGICI
===================================================== */

islemTutamac.addEventListener(
    "touchstart",
    function (event) {

        panelSurukleniyor =
            true;

        panelBaslangicY =
            event.touches[0].clientY;

        islemPanel.style.transition =
            "none";

    },
    {
        passive: true
    }
);


/* =====================================================
   SÜRÜKLEME
===================================================== */

islemTutamac.addEventListener(
    "touchmove",
    function (event) {

        if (!panelSurukleniyor)
            return;


        panelHareketY =
            event.touches[0].clientY -
            panelBaslangicY;


        /*
        Yukarı sürüklemeyi engelle.
        */

        if (panelHareketY < 0) {

            panelHareketY = 0;

        }


        islemPanel.style.transform =
            "translateX(-50%) translateY(" +
            panelHareketY +
            "px)";

    },
    {
        passive: true
    }
);


/* =====================================================
   SÜRÜKLEME BİTİŞİ
===================================================== */

islemTutamac.addEventListener(
    "touchend",
    function () {

        if (!panelSurukleniyor)
            return;


        panelSurukleniyor =
            false;


        islemPanel.style.transition =
            "transform .25s ease";


        /*
        Yeterince aşağı çekildiyse kapat.
        */

        if (panelHareketY > 70) {

            islemPanelKapat();

        }

        else {

            islemPanel.style.transform =
                "translateX(-50%) translateY(0)";

        }


        panelHareketY =
            0;

    }
);

</script>
