<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Mesajlarım - NETmax Gayrimenkul</title>


<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<script src="js/ilanlar.js"></script>


<style>

/* =====================================================
   GENEL
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    background: #f2f4f7;

    font-family:
        'Titillium Web',
        Arial,
        sans-serif;

    color: #222;
}


/* =====================================================
   ANA KAPSÜL
===================================================== */

.mesajlar-container {

    width: 100%;

    max-width: 600px;

    min-height: 100vh;

    margin: auto;

    background: #ffffff;

    position: relative;
}


/* =====================================================
   MESAJLARIM BAŞLIK
===================================================== */

.mesajlar-header {

    height: 60px;

    display: flex;

    align-items: center;

    padding: 0 15px;

    background: #ffffff;

    border-bottom: 1px solid #e5e7eb;

    font-size: 20px;

    font-weight: normal;
}

.mesajlar-header i {

    margin-right: 12px;

    color: #2563eb;
}


/* =====================================================
   İLAN LİSTESİ
===================================================== */

.mesaj-ilan-listesi {

    width: 100%;
}


/* =====================================================
   İLAN SATIRI
===================================================== */

.mesaj-ilan {

    width: 100%;

    min-height: 85px;

    display: flex;

    align-items: center;

    padding: 10px 15px;

    border-bottom: 1px solid #eeeeee;

    cursor: pointer;

    background: #ffffff;
}

.mesaj-ilan:hover {

    background: #f8fafc;
}


/* =====================================================
   İLAN RESMİ
===================================================== */

.mesaj-ilan-resim {

    width: 65px;

    height: 65px;

    border-radius: 8px;

    object-fit: cover;

    flex-shrink: 0;
}


/* =====================================================
   İLAN BİLGİ
===================================================== */

.mesaj-ilan-bilgi {

    flex: 1;

    min-width: 0;

    margin-left: 12px;
}

.mesaj-ilan-baslik {

    font-size: 16px;

    font-weight: normal;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.mesaj-ilan-alt {

    font-size: 14px;

    color: #777;

    margin-top: 3px;
}


/* =====================================================
   SAĞ OK
===================================================== */

.mesaj-ilan-ok {

    margin-left: 10px;

    color: #999;

    font-size: 18px;
}


/* =====================================================
   BOŞ MESAJ
===================================================== */

.mesaj-bos {

    padding: 50px 20px;

    text-align: center;

    color: #888;
}

.mesaj-bos i {

    font-size: 45px;

    margin-bottom: 15px;
}


/* =====================================================
   SOHBET EKRANI
===================================================== */

.sohbet-ekrani {

    display: none;

    position: fixed;

    inset: 0;

    background: #f2f4f7;

    z-index: 10000;
}


/* =====================================================
   SOHBET ÜST ALAN
===================================================== */

.sohbet-header {

    width: 100%;

    max-width: 600px;

    margin: auto;

    height: 68px;

    display: flex;

    align-items: center;

    padding: 6px 10px;

    background: #ffffff;

    border-bottom: 1px solid #dddddd;

    position: relative;
}


/* =====================================================
   GERİ < BUTONU
===================================================== */

.sohbet-geri {

    width: 42px;

    height: 52px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 31px;

    font-weight: normal;

    color: #222;

    cursor: pointer;

    flex-shrink: 0;
}

.sohbet-geri i {

    font-size: 28px;
}


/* =====================================================
   İRTİBAT ALANI
===================================================== */

.sohbet-irtibat {

    flex: 1;

    min-width: 0;

    height: 52px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    padding-left: 5px;

    overflow: hidden;
}

.sohbet-irtibat-baslik {

    font-size: 13px;

    color: #777;

    font-weight: normal;
}

.sohbet-irtibat-no {

    font-size: 15px;

    color: #222;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    font-weight: normal;
}


/* =====================================================
   ÜÇ NOKTA
===================================================== */

.sohbet-islem-buton {

    width: 44px;

    height: 52px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 22px;

    color: #333;

    cursor: pointer;

    flex-shrink: 0;
}


/* =====================================================
   İŞLEM BALONU
===================================================== */

.islem-panel {

    display: none;

    position: fixed;

    z-index: 12000;

    top: 68px;

    left: 50%;

    transform: translateX(-50%);

    width: 100%;

    max-width: 600px;

    background: #ffffff;

    border-bottom: 1px solid #d8d8d8;

    box-shadow:
        0 5px 14px rgba(0,0,0,.12);
}


/* ÜST ÇİZGİ / TUTMA ALANI */

.islem-tutamac {

    height: 28px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;
}

.islem-tutamac-cizgi {

    width: 42px;

    height: 4px;

    border-radius: 10px;

    background: #cfcfcf;
}


/* =====================================================
   İŞLEMLER BAŞLIĞI
===================================================== */

.islem-baslik {

    padding: 10px 18px;

    font-size: 15px;

    color: #777;

    font-weight: normal;

    border-bottom: 1px solid #eeeeee;
}


/* =====================================================
   MESAJI SİL
===================================================== */

.islem-sil {

    width: 100%;

    min-height: 48px;

    display: flex;

    align-items: center;

    padding: 0 18px;

    background: #ffffff;

    border: none;

    font-family: inherit;

    font-size: 15px;

    color: #333;

    text-align: left;

    cursor: pointer;
}

.islem-sil:hover {

    background: #f7f7f7;
}

.islem-sil i {

    margin-right: 10px;

    color: #777;
}


/* =====================================================
   İLAN ÖN İZLEME ALANI
===================================================== */

.sohbet-ilan-onizleme {

    width: 100%;

    max-width: 600px;

    margin: 0 auto;

    background: #ffffff;

    border-bottom: 1px solid #dddddd;

    padding: 12px;
}


/* =====================================================
   ÖN İZLEME KARTI
===================================================== */

.sohbet-ilan-kart {

    width: 100%;

    min-height: 92px;

    display: flex;

    align-items: center;

    background: #ffffff;

    border: 1px solid #e3e3e3;

    border-radius: 8px;

    overflow: hidden;
}


/* =====================================================
   ÖN İZLEME RESMİ
===================================================== */

.sohbet-ilan-kart-resim {

    width: 92px;

    height: 92px;

    object-fit: cover;

    flex-shrink: 0;
}


/* =====================================================
   ÖN İZLEME BİLGİ
===================================================== */

.sohbet-ilan-kart-bilgi {

    min-width: 0;

    flex: 1;

    padding: 10px 12px;
}

.sohbet-ilan-kart-baslik {

    font-size: 15px;

    line-height: 1.35;

    color: #222;

    font-weight: normal;

    display: -webkit-box;

    -webkit-line-clamp: 3;

    -webkit-box-orient: vertical;

    overflow: hidden;
}

.sohbet-ilan-kart-fiyat {

    margin-top: 6px;

    font-size: 14px;

    color: #777;

    font-weight: normal;
}


/* =====================================================
   MESAJ ALANI
===================================================== */

.sohbet-mesajlar {

    width: 100%;

    max-width: 600px;

    margin: auto;

    height:
        calc(100vh - 68px - 117px - 60px);

    overflow-y: auto;

    padding: 15px 12px 20px;
}


/* =====================================================
   MESAJ BALONU
===================================================== */

.mesaj-balonu {

    max-width: 78%;

    padding: 9px 12px;

    border-radius: 10px;

    margin-bottom: 10px;

    font-size: 15px;

    line-height: 1.4;

    font-weight: normal;

    word-wrap: break-word;
}


/* GELEN */

.mesaj-gelen {

    background: #ffffff;

    margin-right: auto;

    border: 1px solid #eeeeee;
}


/* GİDEN */

.mesaj-giden {

    background: #2563eb;

    color: #ffffff;

    margin-left: auto;
}


/* SAAT */

.mesaj-saat {

    display: block;

    font-size: 11px;

    margin-top: 4px;

    opacity: .65;

    text-align: right;

    font-weight: normal;
}


/* =====================================================
   MESAJ GÖNDER PANELİ
===================================================== */

.mesaj-gonder-panel {

    position: fixed;

    bottom: 0;

    left: 50%;

    transform: translateX(-50%);

    width: 100%;

    max-width: 600px;

    height: 60px;

    background: #ffffff;

    border-top: 1px solid #dddddd;

    display: flex;

    align-items: center;

    padding: 8px 10px;

    z-index: 11000;
}


.mesaj-input {

    flex: 1;

    height: 42px;

    border: 1px solid #dddddd;

    border-radius: 21px;

    padding: 0 15px;

    font-family: inherit;

    font-size: 15px;

    outline: none;

    font-weight: normal;
}

.mesaj-input:focus {

    border-color: #2563eb;
}


/* GÖNDER */

.mesaj-gonder {

    width: 42px;

    height: 42px;

    margin-left: 8px;

    border: none;

    border-radius: 50%;

    background: #2563eb;

    color: white;

    font-size: 17px;

    cursor: pointer;

    flex-shrink: 0;
}


/* =====================================================
   YÖNETİCİ GİRİŞ EKRANI
===================================================== */

.mesaj-giris-ekrani {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 20000;

    background: #f2f4f7;

    align-items: center;

    justify-content: center;

    padding: 20px;
}


.mesaj-giris-kutu {

    width: 100%;

    max-width: 380px;

    background: #ffffff;

    border-radius: 12px;

    padding: 25px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.12);
}


.mesaj-giris-baslik {

    font-size: 21px;

    text-align: center;

    margin-bottom: 22px;

    font-weight: normal;
}


.mesaj-giris-input {

    width: 100%;

    height: 44px;

    margin-bottom: 12px;

    border: 1px solid #dddddd;

    border-radius: 7px;

    padding: 0 13px;

    font-family: inherit;

    font-size: 15px;

    outline: none;
}


.mesaj-giris-buton {

    width: 100%;

    height: 44px;

    border: none;

    border-radius: 7px;

    background: #2563eb;

    color: white;

    font-family: inherit;

    font-size: 15px;

    cursor: pointer;
}


/* =====================================================
   YÜKLENİYOR
===================================================== */

.mesaj-yukleniyor {

    padding: 40px 20px;

    text-align: center;

    color: #777;

    font-size: 14px;
}


/* =====================================================
   MOBİL
===================================================== */

@media (max-width: 600px) {

    body {

        background: #ffffff;
    }

    .mesajlar-container {

        width: 100%;

        max-width: none;

        min-height: 100dvh;
    }


    .mesajlar-header {

        height: 56px;

        padding: 0 14px;

        font-size: 18px;
    }


    .mesaj-ilan {

        min-height: 78px;

        padding: 8px 12px;
    }


    .mesaj-ilan-resim {

        width: 58px;

        height: 58px;

        border-radius: 7px;
    }


    .mesaj-ilan-bilgi {

        margin-left: 10px;
    }


    .mesaj-ilan-baslik {

        font-size: 15px;
    }


    .mesaj-ilan-alt {

        font-size: 13px;
    }


    .mesaj-ilan-ok {

        font-size: 16px;

        margin-left: 7px;
    }


    .sohbet-header {

        max-width: none;

        height: 62px;

        padding: 5px 6px;
    }


    .sohbet-geri {

        width: 40px;

        font-size: 28px;
    }


    .sohbet-irtibat {

        height: 50px;
    }


    .sohbet-irtibat-baslik {

        font-size: 12px;
    }


    .sohbet-irtibat-no {

        font-size: 14px;
    }


    .sohbet-islem-buton {

        width: 42px;

        height: 50px;
    }


    .islem-panel {

        top: 62px;

        max-width: none;
    }


    .sohbet-ilan-onizleme {

        max-width: none;

        padding: 10px;
    }


    .sohbet-ilan-kart {

        min-height: 98px;
    }


    .sohbet-ilan-kart-resim {

        width: 98px;

        height: 98px;
    }


    .sohbet-ilan-kart-baslik {

        font-size: 14px;

        -webkit-line-clamp: 3;
    }


    .sohbet-ilan-kart-fiyat {

        font-size: 13px;
    }


    .sohbet-mesajlar {

        max-width: none;

        height:
            calc(100dvh - 62px - 118px - 60px);

        padding: 12px;
    }


    .mesaj-balonu {

        max-width: 82%;

        font-size: 14px;
    }


    .mesaj-gonder-panel {

        max-width: none;

        height: 60px;

        padding: 8px;
    }


    .mesaj-input {

        height: 42px;

        font-size: 14px;
    }


    .mesaj-gonder {

        width: 42px;

        height: 42px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     YÖNETİCİ GİRİŞ
===================================================== -->

    <div class="mesaj-giris-kutu">

        <div class="mesaj-giris-baslik">

        </div>

        <input
            id="mesajEmail"
            class="mesaj-giris-input"

        <input
            id="mesajSifre"
            class="mesaj-giris-input"
            type="password"

        <button
            class="mesaj-giris-buton"
            onclick="mesajlarGirisYap()">

            Giriş Yap

        </button>

    </div>

</div>


<!-- =====================================================
     MESAJLAR LİSTESİ
===================================================== -->

<div class="mesajlar-container"
     id="mesajlarContainer"
     style="display:none;">

    <div class="mesajlar-header">

        <i class="fa-solid fa-comments"></i>

        Mesajlarım

    </div>


    <div id="mesajIlanListesi"
         class="mesaj-ilan-listesi">

            Mesajlar yükleniyor...

        </div>

    </div>

</div>


<!-- =====================================================
     ZİYARETÇİ SOHBET EKRANI
===================================================== -->

<div id="sohbetEkrani"
     class="sohbet-ekrani">


    <!-- ÜST ALAN -->

    <div class="sohbet-header">


        <!-- GERİ -->

        <div class="sohbet-geri"
             onclick="sohbetKapat()">

            <i class="fa-solid fa-angle-left"></i>

        </div>


        <!-- İRTİBAT -->

            <div class="sohbet-irtibat-baslik">

            </div>

            <div id="sohbetIrtibatNo"

        <div class="sohbet-islem-buton"
             onclick="islemPanelAc()">

         İŞLEM PANELİ
    ================================================= -->

    <div id="islemPanel"
         class="islem-panel">

             onclick="islemPanelKapat()">

            <div class="islem-tutamac-cizgi"></div>

        </div>


        <div class="islem-baslik">

            İşlemler

        </div>


        <button id="mesajSilButonu"
                    class="islem-sil"
                    onclick="mesajlariSil()">
            
                <i class="fa-regular fa-trash-can"></i>
            
                Mesajı sil
            
         </button>

    </div>


    <!-- =================================================
         İLAN ÖN İZLEME
    ================================================= -->

    <div class="sohbet-ilan-onizleme">

        <div class="sohbet-ilan-kart">


            <img id="sohbetIlanResim"
                 class="sohbet-ilan-kart-resim"
                 src=""
                 alt="">


            <div class="sohbet-ilan-kart-bilgi">

                <div id="sohbetIlanBaslik"
                     class="sohbet-ilan-kart-baslik">
                </div>


                <div id="sohbetIlanFiyat"
                     class="sohbet-ilan-kart-fiyat">
                </div>

         MESAJLAR
    ================================================= -->

    <div id="sohbetMesajlar"

         MESAJ YAZ
    ================================================= -->

    <div class="mesaj-gonder-panel">

        <input
            id="mesajInput"
            class="mesaj-input"
            type="text"
            placeholder="Mesajınızı yazın...">

        <button
            class="mesaj-gonder"
            onclick="mesajGonder()">

            <i class="fa-solid fa-arrow-right"></i>

        </button>

    </div>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
    getAuth,
    signInAnonymously,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
    getDatabase,
    ref,
    push,
    set,
    onValue,
    remove,
    get
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


/* =====================================================
   FIREBASE AYARLARI
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBVMw9NS3R49xqnVLgmlAiSvTtYXFrHwB0",

    authDomain:
        "netmax-mesajlar.firebaseapp.com",

    databaseURL:
        "https://netmax-mesajlar-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "netmax-mesajlar",

    storageBucket:
        "netmax-mesajlar.firebasestorage.app",

    messagingSenderId:
        "575038344835",

    appId:
        "1:575038344835:web:513417e69f4a291dc095b6"
};


/* =====================================================
   FIREBASE BAŞLAT
===================================================== */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const database =
    getDatabase(app);


/* =====================================================
   URL
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const gelenIlanID =
    urlParams.get("ilan");


/* =====================================================
   GLOBAL
===================================================== */

let aktifIlan = null;

let aktifMesajlar = {};

let ziyaretciUID = null;


/* =====================================================
   İLANI BUL
===================================================== */

if (
    gelenIlanID &&
    typeof ilanlarVerisi !== "undefined"
) {

    aktifIlan =
        ilanlarVerisi.find(

            ilan =>
                String(ilan.id) ===
                String(gelenIlanID)

        );

}


/* =====================================================
   İLAN BAŞLIĞI OLUŞTUR
===================================================== */

function ilanBasligiOlustur(ilan) {

    if (!ilan) return "";


    let kartBaslik = "";


    kartBaslik +=
        ilan.baslik || "";


    /* DURUM */

    if (ilan.durum === "satilik") {

        kartBaslik +=
            " SATILIK";

    }

    else if (ilan.durum === "kiralik") {

        kartBaslik +=
            " KİRALIK";

    }

    else if (
        ilan.durum === "kat-karsiligi"
    ) {

        kartBaslik +=
            " KAT KARŞILIĞI";

    }


    /* DAİRE */

    if (
        ilan.konutSekli &&
        ilan.konutSekli
            .toLowerCase() === "daire"
    ) {

        kartBaslik +=
            " Daire";

    }


    /* DÜKKAN */

    else if (
        ilan.konutTipi &&
        ilan.konutTipi
            .toLowerCase() === "dükkan"
    ) {

        kartBaslik +=
            " Dükkan";

    }


    /* VİLLA */

    else if (

        (
            ilan.konutTipi &&
            ilan.konutTipi
                .toLowerCase() === "villa"
        )

        ||

        (
            ilan.konutSekli &&
            ilan.konutSekli
                .toLowerCase() === "villa"
        )

    ) {

        kartBaslik +=
            " Villa";

    }


    /* ARSA / TARLA */

    else if (

        ilan.tip &&

        (
            ilan.tip.toLowerCase() === "arsa" ||

            ilan.tip.toLowerCase() === "tarla"
        )

    ) {

        kartBaslik +=
            " " +
            ilan.tip.charAt(0)
                .toUpperCase() +
            ilan.tip.slice(1)
                .toLowerCase();

    }


    /* ODA SAYISI */

    if (

        ilan.konutSekli &&

        ilan.konutSekli
            .toLowerCase() === "daire" &&

        ilan["Oda Sayısı"]

    ) {

        kartBaslik +=
            " " +
            ilan["Oda Sayısı"];

    }


    return kartBaslik;
}


/* =====================================================
   İLAN ÖN İZLEMESİNİ DOLDUR
===================================================== */

function ilanOnizlemeyiDoldur() {

    if (!aktifIlan) return;


    const resim =

        aktifIlan.resimler &&

        aktifIlan.resimler.length > 0

            ? aktifIlan.resimler[0]

            : "";


    document
        .getElementById(
            "sohbetIlanResim"
        )
        .src = resim;


    document
        .getElementById(
            "sohbetIlanBaslik"
        )
        .textContent =
            ilanBasligiOlustur(
                aktifIlan
            );


    document
        .getElementById(
            "sohbetIlanFiyat"
        )
        .textContent =

        aktifIlan.fiyat

            ? aktifIlan.fiyat +
              " " +

                  aktifIlan.paraBirimi ||
                  ""
              )

            : "";
}

===================================================== */

function ziyaretciSohbetiniAc() {

    if (!aktifIlan) {

        alert(
            "İlan bulunamadı."
        );

        return;

    }


    ilanOnizlemeyiDoldur();

}


/* =====================================================
   ZİYARETÇİ MESAJLARINI DİNLE
===================================================== */

function mesajlariDinle() {

    if (!gelenIlanID) return;

    if (!ziyaretciUID) return;


    const mesajRef =
        ref(
            database,
            "mesajlar/" +
            gelenIlanID
        );


    onValue(
        mesajRef,
        (snapshot) => {

            const veri =
                snapshot.val() || {};


            aktifMesajlar =
                veri;


            sohbetMesajlariniGoster();

        }
    );

}


/* =====================================================
   MESAJLARI GÖSTER
===================================================== */

function sohbetMesajlariniGoster() {

    const alan =
        document.getElementById(
            "sohbetMesajlar"
        );


    alan.innerHTML = "";


    const liste =
        Object.entries(
            aktifMesajlar
        );


    if (liste.length === 0) {

        return;

    }


    liste.sort(
        (a, b) => {

            return (
                (a[1].zaman || 0) -
                (b[1].zaman || 0)
            );

        }
    );


    liste.forEach(
        ([mesajID, mesaj]) => {


            const balon =
                document.createElement(
                    "div"
                );


            balon.className =
                "mesaj-balonu " +

                (
                    mesaj.uid ===
                    ziyaretciUID

                        ? "mesaj-giden"

                        : "mesaj-gelen"
                );


            const metin =
                document.createElement(
                    "div"
                );


            metin.textContent =
                mesaj.mesaj || "";


            const saat =
                document.createElement(
                    "span"
                );


            saat.className =
                "mesaj-saat";


            saat.textContent =
                saatFormatla(
                    mesaj.zaman
                );


            balon.appendChild(
                metin
            );


            balon.appendChild(
                saat
            );


            alan.appendChild(
                balon
            );

        }
    );


    alan.scrollTop =
        alan.scrollHeight;
}


/* =====================================================
   SAAT
===================================================== */

function saatFormatla(zaman) {

    if (!zaman) return "";


    const tarih =
        new Date(zaman);


    return tarih.toLocaleTimeString(
        "tr-TR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =====================================================
   MESAJ GÖNDER
===================================================== */

window.mesajGonder =
async function () {

    const input =
        document.getElementById(
            "mesajInput"
        );


    const mesaj =
        input.value.trim();


    if (!mesaj) return;


    if (!ziyaretciUID) {

        alert(
            "Firebase bağlantısı henüz hazır değil."
        );

        return;

    }


    if (!gelenIlanID) {

        alert(
            "İlan bulunamadı."
        );

        return;

    }


    try {


        const mesajRef =
            ref(
                database,
                "mesajlar/" +
                gelenIlanID
            );


        const yeniMesaj =
            push(mesajRef);


        await set(
            yeniMesaj,
            {

                mesaj:
                    mesaj,

                uid:
                    ziyaretciUID,

                zaman:
                    Date.now()

            }
        );


        input.value = "";


        console.log(
            "MESAJ FIREBASE'E KAYDEDİLDİ"
        );


    }

    catch (error) {

        console.error(
            "MESAJ KAYIT HATASI:",
            error
        );


        alert(
            "Mesaj gönderilemedi."
        );

    }

};

/* =====================================================
   MESAJLARI SİL
===================================================== */

window.mesajlariSil =
async function () {

    if (!gelenIlanID) return;


    const onay =
        confirm(
            "Bu konuşmadaki mesajları silmek istiyor musunuz?"
        );


    if (!onay) return;


    try {

        await remove(

            ref(
                database,
                "mesajlar/" +
                gelenIlanID
            )

        );


        islemPanelKapat();


        console.log(
            "MESAJLAR SİLİNDİ"
        );

    }

    catch (error) {

        console.error(
            "MESAJ SİLME HATASI:",
            error
        );

        alert(
            "Mesajlar silinemedi."
        );

    }

};


/* =====================================================
   SOHBET KAPAT
===================================================== */

window.sohbetKapat =
function () {

    document
        .getElementById(
            "sohbetEkrani"
        )
        .style.display = "none";


    islemPanelKapat();


    /*
    Ziyaretçi sayfasında geri dönmek
    için bir önceki sayfaya dönüyoruz.
    */

    if (
        document.referrer &&
        document.referrer !==
        window.location.href
    ) {

        history.back();

    }

};

/* =====================================================
   YÖNETİCİ MESAJLARI OKU
===================================================== */

function yoneticiMesajlariniYukle() {

    console.log(
        "YÖNETİCİ MESAJLARI YÜKLE FONKSİYONU ÇALIŞTI"
    );


    const liste =
        document.getElementById(
            "mesajIlanListesi"
        );


    liste.innerHTML =
        '<div class="mesaj-yukleniyor">' +
        'Mesajlar yükleniyor...' +
        '</div>';


    const mesajlarRef =
        ref(
            database,
            "mesajlar"
        );


    console.log(
        "FIREBASE ONVALUE BAŞLATILIYOR"
    );


    /* =========================================
       TEK SEFERLİK FIREBASE OKUMA TESTİ
    ========================================= */

    get(mesajlarRef)

        .then((snapshot) => {

            console.log(
                "GET İLE FIREBASE VERİSİ:",
                snapshot.val()
            );

        })

        .catch((error) => {

            console.error(
                "GET OKUMA HATASI:",
                error
            );

        });


    /* =========================================
       CANLI MESAJ DİNLEME
    ========================================= */

    onValue(

        mesajlarRef,

        (snapshot) => {


            console.log(
                "FIREBASE MESAJ VERİSİ GELDİ:",
                snapshot.val()
            );


            const veri =
                snapshot.val() || {};


            const ilanlar =
                Object.entries(
                    veri
                );



            if (
                ilanlar.length === 0
            ) {

                liste.innerHTML =

                    '<div class="mesaj-bos">' +

                    '<i class="fa-regular fa-comment-dots"></i>' +

                    '<div>Henüz mesajınız yok.</div>' +

                    '</div>';

                return;

            }


            liste.innerHTML = "";


            ilanlar.forEach(
                ([ilanID, mesajlar]) => {


                    const ilan =
                        ilanlarVerisi.find(

                            x =>
                                String(x.id) ===
                                String(ilanID)

                        );

                    if (!ilan) return;


                    const mesajListesi =
                        Object.values(
                            mesajlar || {}
                        );


                    if (
                        mesajListesi.length === 0
                    ) return;


                    mesajListesi.sort(

                        (a, b) =>

                            (b.zaman || 0) -
                            (a.zaman || 0)

                    );


                    const sonMesaj =
                        mesajListesi[0];


                    const satir =
                        document.createElement(
                            "div"
                        );


                    satir.className =
                        "mesaj-ilan";


                    const resim =
                        document.createElement(
                            "img"
                        );


                    resim.className =
                        "mesaj-ilan-resim";


                    resim.src =

                        ilan.resimler &&
                        ilan.resimler.length

                            ? ilan.resimler[0]

                            : "";


                    const bilgi =
                        document.createElement(
                            "div"
                        );


                    bilgi.className =
                        "mesaj-ilan-bilgi";


                    const baslik =
                        document.createElement(
                            "div"
                        );


                    baslik.className =
                        "mesaj-ilan-baslik";


                    baslik.textContent =
                        ilanBasligiOlustur(
                            ilan
                        );


                    const alt =
                        document.createElement(
                            "div"
                        );


                    alt.className =
                        "mesaj-ilan-alt";


                    alt.textContent =
                        sonMesaj.mesaj ||
                        "";


                    bilgi.appendChild(
                        baslik
                    );


                    bilgi.appendChild(
                        alt
                    );


                    const ok =
                        document.createElement(
                            "div"
                        );


                    ok.className =
                        "mesaj-ilan-ok";


                    ok.innerHTML =
                        '<i class="fa-solid fa-chevron-right"></i>';


                    satir.appendChild(
                        resim
                    );


                    satir.appendChild(
                        bilgi
                    );


                    satir.appendChild(
                        ok
                    );


                    satir.onclick =
                        function () {

                            window.location.href =
                                "mesajlar.html?ilan=" +
                                ilanID;

                        };


                    liste.appendChild(
                        satir
                    );

                }
            );

        }
    );

}
