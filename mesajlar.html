<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mesajlarım - NETmax Gayrimenkul</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="js/ilanlar.js"></script>

<script type="module">

    import { initializeApp } 
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import { getAuth, signInAnonymously } 
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBVMw9NS3R49xqnVLgmlAiSvTtYXFrHwB0",
        authDomain: "netmax-mesajlar.firebaseapp.com",
        databaseURL: "https://netmax-mesajlar-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "netmax-mesajlar",
        storageBucket: "netmax-mesajlar.firebasestorage.app",
        messagingSenderId: "575038344835",
        appId: "1:575038344835:web:513417e69f4a291dc095b6"
    };

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    signInAnonymously(auth)
        .then((userCredential) => {

            window.firebaseKullanici =
                userCredential.user;

            console.log(
                "MESAJLAR FIREBASE BAĞLANDI"
            );

            console.log(
                "UID:",
                userCredential.user.uid
            );

        })
        .catch((error) => {

            console.error(
                "MESAJLAR FIREBASE HATASI:",
                error
            );

        });

</script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f5;
    font-family: 'Titillium Web', sans-serif;
}


/* ANA KAPSÜL */

.mesajlar-container {
    width: 100%;
    max-width: 600px;
    min-height: 100vh;
    margin: auto;
    background: white;
    position: relative;
}


/* ÜST BAŞLIK */

.mesajlar-header {
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 15px;
    background: white;
    border-bottom: 1px solid #eee;
    font-size: 20px;
    font-weight: bold;
}

.mesajlar-header i {
    margin-right: 12px;
    color: #2563eb;
}


/* İLAN LİSTESİ */

.mesaj-ilan-listesi {
    width: 100%;
}


/* İLAN SATIRI */

.mesaj-ilan {
    width: 100%;
    min-height: 85px;
    display: flex;
    align-items: center;
    padding: 10px 15px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    background: white;
}

.mesaj-ilan:hover {
    background: #f8fafc;
}


/* İLAN RESMİ */

.mesaj-ilan-resim {
    width: 65px;
    height: 65px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
}


/* İLAN BİLGİSİ */

.mesaj-ilan-bilgi {
    flex: 1;
    min-width: 0;
    margin-left: 12px;
}

.mesaj-ilan-baslik {
    font-size: 16px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.mesaj-ilan-alt {
    font-size: 14px;
    color: #777;
    margin-top: 3px;
}


/* SAĞ OK */

.mesaj-ilan-ok {
    margin-left: 10px;
    color: #999;
    font-size: 18px;
}


/* BOŞ MESAJ */

.mesaj-bos {
    padding: 50px 20px;
    text-align: center;
    color: #888;
}

.mesaj-bos i {
    font-size: 45px;
    margin-bottom: 15px;
}


/* =========================================================
   SOHBET
========================================================= */

.sohbet-ekrani {
    display: none;
    position: fixed;
    inset: 0;
    background: #f5f5f5;
    z-index: 10000;
}


/* =========================================================
   SOHBET ÜST
========================================================= */

.sohbet-header {
    width: 100%;
    max-width: 600px;
    margin: auto;
    height: 70px;
    display: flex;
    align-items: center;
    padding: 8px 12px;

    /* BURASI ÜST ALAN RENGİ */
    background: #2563eb;

    border-bottom: 1px solid #ddd;

    position: relative;
    z-index: 10001;
}


/* =========================================================
   GERİ < İŞARETİ
========================================================= */

.sohbet-geri {
    width: 40px;
    height: 100%;
    display: flex;
    align-items: center;

    cursor: pointer;

    color: white;
    font-size: 34px;
    font-weight: 300;
    line-height: 1;

    flex-shrink: 0;
}

.sohbet-geri i {
    display: none;
}

.sohbet-geri::before {
    content: "<";
    color: white;
    font-family: Arial, sans-serif;
    font-size: 34px;
    font-weight: 300;
}


/* =========================================================
   İLAN ÖN İZLEMESİ
========================================================= */

.sohbet-ilan-resim {
    width: 50px;
    height: 50px;
    border-radius: 7px;
    object-fit: cover;
    flex-shrink: 0;
}

.sohbet-ilan-bilgi {
    margin-left: 10px;
    min-width: 0;
    flex: 1;
}

.sohbet-ilan-baslik {
    font-weight: bold;
    font-size: 16px;

    color: white;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.sohbet-ilan-alt {
    font-size: 13px;

    color: rgba(255,255,255,.85);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================================================
   SAĞ ÜST ...
========================================================= */

.sohbet-islemler {
    width: 40px;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-left: 5px;

    color: white;

    font-size: 22px;

    cursor: pointer;

    flex-shrink: 0;
}

.sohbet-islemler:active {
    opacity: .65;
}


/* =========================================================
   MESAJ ALANI
========================================================= */

.sohbet-mesajlar {
    width: 100%;
    max-width: 600px;
    margin: auto;

    height: calc(100vh - 130px);

    overflow-y: auto;

    padding: 15px;
}


/* =========================================================
   MESAJ BALONLARI
========================================================= */

.mesaj-balonu {
    max-width: 78%;
    padding: 9px 12px;
    border-radius: 10px;
    margin-bottom: 10px;
    font-size: 15px;
    line-height: 1.4;
}

.mesaj-gelen {
    background: white;
    margin-right: auto;
}

.mesaj-giden {
    background: #2563eb;
    color: white;
    margin-left: auto;
}

.mesaj-saat {
    display: block;
    font-size: 11px;
    margin-top: 4px;
    opacity: .65;
    text-align: right;
}


/* =========================================================
   MESAJ GÖNDERME
========================================================= */

.mesaj-gonder-panel {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);

    width: 100%;
    max-width: 600px;

    height: 60px;

    background: white;

    border-top: 1px solid #ddd;

    display: flex;
    align-items: center;

    padding: 8px 10px;

    z-index: 10002;
}

.mesaj-input {
    flex: 1;

    height: 42px;

    border: 1px solid #ddd;

    border-radius: 21px;

    padding: 0 15px;

    font-family: inherit;

    font-size: 15px;

    outline: none;
}

.mesaj-gonder {
    width: 42px;
    height: 42px;

    margin-left: 8px;

    border: none;

    border-radius: 50%;

    background: #2563eb;

    color: white;

    font-size: 17px;

    cursor: pointer;
}


/* =========================================================
   İŞLEM PANELİ ARKA PLAN
========================================================= */

.islem-karartma {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.35);

    z-index: 20000;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity .2s ease,
        visibility .2s ease;
}

.islem-karartma.acik {
    opacity: 1;
    visibility: visible;
}


/* =========================================================
   ALTTAN GELEN PANEL
========================================================= */

.islem-panel {
    position: fixed;

    left: 50%;
    bottom: 0;

    transform:
        translate(-50%, 100%);

    width: 100%;
    max-width: 600px;

    background: white;

    border-radius:
        18px 18px 0 0;

    z-index: 20001;

    overflow: hidden;

    transition:
        transform .25s ease;

    box-shadow:
        0 -4px 20px rgba(0,0,0,.15);

    padding-bottom:
        env(safe-area-inset-bottom);
}

.islem-panel.acik {
    transform:
        translate(-50%, 0);
}


/* =========================================================
   ÜST SÜRÜKLEME ÇİZGİSİ
========================================================= */

.islem-surukme-cizgisi {
    width: 42px;
    height: 5px;

    background: #c8c8c8;

    border-radius: 10px;

    margin:
        9px auto 7px;
}


/* =========================================================
   İŞLEMLER
========================================================= */

.islem-baslik {
    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 16px;

    font-weight: bold;

    color: #222;
}


/* ÇİZGİ */

.islem-ayirici {
    width: 100%;
    height: 1px;

    background: #e5e5e5;
}


/* =========================================================
   MESAJI SİL
========================================================= */

.mesaj-sil {
    width: 100%;
    height: 52px;

    display: flex;
    align-items: center;

    justify-content: flex-start;

    padding: 0 20px;

    border: none;

    background: white;

    color: #d11a2a;

    font-family: inherit;

    font-size: 16px;

    cursor: pointer;

    text-align: left;
}

.mesaj-sil:active {
    background: #f7f7f7;
}

.mesaj-sil i {
    margin-right: 10px;
}


/* =========================================================
   MOBİL
========================================================= */

@media (max-width: 600px) {

    body {
        background: white;
    }

    .mesajlar-container {
        width: 100%;
        max-width: none;
        min-height: 100dvh;
    }

    .mesajlar-header {
        height: 56px;
        padding: 0 14px;
        font-size: 18px;
    }

    .mesaj-ilan {
        min-height: 78px;
        padding: 8px 12px;
    }

    .mesaj-ilan-resim {
        width: 58px;
        height: 58px;
        border-radius: 7px;
    }

    .mesaj-ilan-bilgi {
        margin-left: 10px;
    }

    .mesaj-ilan-baslik {
        font-size: 15px;
    }

    .mesaj-ilan-alt {
        font-size: 13px;
    }

    .mesaj-ilan-ok {
        font-size: 16px;
        margin-left: 7px;
    }

    .sohbet-header {
        max-width: none;
        height: 62px;
        padding: 6px 8px;
    }

    .sohbet-geri {
        width: 38px;
        font-size: 20px;
    }

    .sohbet-geri::before {
        font-size: 31px;
    }

    .sohbet-ilan-resim {
        width: 45px;
        height: 45px;
    }

    .sohbet-ilan-baslik {
        font-size: 15px;
    }

    .sohbet-ilan-alt {
        font-size: 12px;
    }

    .sohbet-islemler {
        width: 38px;
        font-size: 21px;
    }

    .sohbet-mesajlar {
        max-width: none;
        height: calc(100dvh - 122px);
        padding: 12px;
    }

    .mesaj-balonu {
        max-width: 82%;
        font-size: 14px;
    }

    .mesaj-gonder-panel {
        max-width: none;
        height: 60px;
        padding: 8px;
    }

    .mesaj-input {
        height: 42px;
        font-size: 14px;
    }

    .mesaj-gonder {
        width: 42px;
        height: 42px;
        flex-shrink: 0;
    }

    .islem-panel {
        max-width: none;
    }

}


/* =========================================================
   PANEL SÜRÜKLEME
========================================================= */

</style>
</head>

<body>


<div class="mesajlar-container">

    <div class="mesajlar-header">

        <i class="fa-solid fa-comments"></i>

        Mesajlarım

    </div>


    <div id="mesajIlanListesi"
         class="mesaj-ilan-listesi">

        <div class="mesaj-bos">

            <i class="fa-regular fa-comment-dots"></i>

            <div>
                Henüz mesajınız yok.
            </div>

        </div>

    </div>

</div>



<!-- =====================================================
     SOHBET EKRANI
===================================================== -->

<div id="sohbetEkrani"
     class="sohbet-ekrani">


    <div class="sohbet-header">


        <!-- GERİ -->

        <div class="sohbet-geri"
             onclick="sohbetKapat()">

            <i class="fa-solid fa-arrow-left"></i>

        </div>


        <!-- MEVCUT İLAN ÖN İZLEMESİ -->

        <img id="sohbetIlanResim"
             class="sohbet-ilan-resim"
             src="">


        <div class="sohbet-ilan-bilgi">

            <div id="sohbetIlanBaslik"
                 class="sohbet-ilan-baslik">
            </div>

            <div id="sohbetIlanAlt"
                 class="sohbet-ilan-alt">
            </div>

        </div>


        <!-- YENİ ... -->

        <div class="sohbet-islemler"
             onclick="islemPanelAc()">

            <i class="fa-solid fa-ellipsis"></i>

        </div>


    </div>



    <div id="sohbetMesajlar"
         class="sohbet-mesajlar">
    </div>



    <div class="mesaj-gonder-panel">

        <input
            id="mesajInput"
            class="mesaj-input"
            type="text"
            placeholder="Mesajınızı yazın..."
        >

        <button
            class="mesaj-gonder"
            onclick="mesajGonder()">

            <i class="fa-solid fa-paper-plane"></i>

        </button>

    </div>

</div>



<!-- =====================================================
     İŞLEM PANELİ KARARTMASI
===================================================== -->

<div id="islemKarartma"
     class="islem-karartma"
     onclick="islemPanelKapat()">
</div>



<!-- =====================================================
     ALTTAN AÇILAN İŞLEM PANELİ
===================================================== -->

<div id="islemPanel"
     class="islem-panel">


    <!-- ÜST SÜRÜKLEME ÇİZGİSİ -->

    <div class="islem-surukme-cizgisi"
         id="islemSurukmeCizgisi">
    </div>


    <!-- BAŞLIK -->

    <div class="islem-baslik">
        İşlemler
    </div>


    <!-- AYIRICI -->

    <div class="islem-ayirici">
    </div>


    <!-- MESAJI SİL -->

    <button class="mesaj-sil"
            onclick="mesajSil()">

        <i class="fa-regular fa-trash-can"></i>

        <span>
            Mesajı sil
        </span>

    </button>


</div>



<script>


const urlParams =
    new URLSearchParams(
        window.location.search
    );


const gelenIlanID =
    urlParams.get("ilan");


let aktifIlan = null;



// İLANI BUL

if (
    gelenIlanID &&
    typeof ilanlarVerisi !== "undefined"
) {

    aktifIlan =
        ilanlarVerisi.find(
            ilan =>
                String(ilan.id) ===
                String(gelenIlanID)
        );

}


console.log(
    "GELEN İLAN ID:",
    gelenIlanID
);


console.log(
    "AKTİF İLAN:",
    aktifIlan
);



// İLAN BULUNDUYSA

if (aktifIlan) {


    // İLAN RESMİ

    const resim =
        aktifIlan.resimler &&
        aktifIlan.resimler.length > 0

            ? aktifIlan.resimler[0]

            : "";


    document.getElementById(
        "sohbetIlanResim"
    ).src = resim;



    // İLAN BAŞLIĞI

    let kartBaslik = "";


    kartBaslik +=
        aktifIlan.baslik || "";



    // DURUM

    if (
        aktifIlan.durum ===
        "satilik"
    ) {

        kartBaslik +=
            " SATILIK";

    }

    else if (
        aktifIlan.durum ===
        "kiralik"
    ) {

        kartBaslik +=
            " KİRALIK";

    }

    else if (
        aktifIlan.durum ===
        "kat-karsiligi"
    ) {

        kartBaslik +=
            " KAT KARŞILIĞI";

    }



    // DAİRE

    if (
        aktifIlan.konutSekli &&
        aktifIlan.konutSekli
            .toLowerCase() === "daire"
    ) {

        kartBaslik +=
            " Daire";

    }


    // DÜKKAN

    else if (
        aktifIlan.konutTipi &&
        aktifIlan.konutTipi
            .toLowerCase() === "dükkan"
    ) {

        kartBaslik +=
            " Dükkan";

    }


    // VİLLA

    else if (

        (
            aktifIlan.konutTipi &&
            aktifIlan.konutTipi
                .toLowerCase() === "villa"
        )

        ||

        (
            aktifIlan.konutSekli &&
            aktifIlan.konutSekli
                .toLowerCase() === "villa"
        )

    ) {

        kartBaslik +=
            " Villa";

    }



    // ARSA / TARLA

    else if (
        aktifIlan.tip &&

        (
            aktifIlan.tip
                .toLowerCase() === "arsa"

            ||

            aktifIlan.tip
                .toLowerCase() === "tarla"
        )
    ) {

        kartBaslik +=
            " " +
            aktifIlan.tip
                .charAt(0)
                .toUpperCase() +

            aktifIlan.tip
                .slice(1)
                .toLowerCase();

    }



    // SADECE DAİREDE ODA SAYISI

    if (
        aktifIlan.konutSekli &&
        aktifIlan.konutSekli
            .toLowerCase() === "daire" &&

        aktifIlan["Oda Sayısı"]
    ) {

        kartBaslik +=
            " " +
            aktifIlan["Oda Sayısı"];

    }



    // BAŞLIK

    document.getElementById(
        "sohbetIlanBaslik"
    ).textContent =
        kartBaslik;



    // FİYAT

    document.getElementById(
        "sohbetIlanAlt"
    ).textContent =

        aktifIlan.fiyat

            ? aktifIlan.fiyat +
              " " +
              (aktifIlan.paraBirimi || "")

            : "";



    // SOHBETİ AÇ

    document.getElementById(
        "sohbetEkrani"
    ).style.display =
        "block";

}



// =====================================================
// SOHBETİ KAPAT
// =====================================================

function sohbetKapat() {

    islemPanelKapat();

    document.getElementById(
        "sohbetEkrani"
    ).style.display =
        "none";

}



// =====================================================
// İŞLEM PANELİNİ AÇ
// =====================================================

function islemPanelAc() {

    document.getElementById(
        "islemPanel"
    ).classList.add("acik");


    document.getElementById(
        "islemKarartma"
    ).classList.add("acik");

}



// =====================================================
// İŞLEM PANELİNİ KAPAT
// =====================================================

function islemPanelKapat() {

    document.getElementById(
        "islemPanel"
    ).classList.remove("acik");


    document.getElementById(
        "islemKarartma"
    ).classList.remove("acik");

}



// =====================================================
// MESAJI SİL
// =====================================================

function mesajSil() {

    /*
       ŞİMDİLİK SADECE TEST.

       GERÇEK FIREBASE SİLME İŞLEMİNİ
       SONRA BAĞLAYACAĞIZ.
    */

    console.log(
        "MESAJI SİL TIKLANDI"
    );

    islemPanelKapat();

}



// =====================================================
// MESAJ GÖNDER
// =====================================================

function mesajGonder() {

    const input =
        document.getElementById(
            "mesajInput"
        );


    const mesaj =
        input.value.trim();


    if (!mesaj) return;


    console.log(
        "Gönderilecek mesaj:",
        mesaj
    );


    input.value = "";

}



// =====================================================
// PANELİ AŞAĞI SÜRÜKLE
// =====================================================

const islemPanel =
    document.getElementById(
        "islemPanel"
    );


const islemSurukmeCizgisi =
    document.getElementById(
        "islemSurukmeCizgisi"
    );


let baslangicY = 0;

let mevcutY = 0;

let surukleniyor = false;



islemSurukmeCizgisi.addEventListener(
    "touchstart",
    function(e) {

        baslangicY =
            e.touches[0].clientY;

        mevcutY =
            baslangicY;

        surukleniyor = true;

        islemPanel.style.transition =
            "none";

    },
    { passive: true }
);



islemSurukmeCizgisi.addEventListener(
    "touchmove",
    function(e) {

        if (!surukleniyor)
            return;


        mevcutY =
            e.touches[0].clientY;


        const fark =
            mevcutY -
            baslangicY;


        if (fark > 0) {

            islemPanel.style.transform =
                `translate(-50%, ${fark}px)`;

        }

    },
    { passive: true }
);



islemSurukmeCizgisi.addEventListener(
    "touchend",
    function() {

        if (!surukleniyor)
            return;


        surukleniyor = false;


        const fark =
            mevcutY -
            baslangicY;


        islemPanel.style.transition =
            "transform .25s ease";


        if (fark > 80) {

            islemPanel.style.transform =
                "translate(-50%, 100%)";


            setTimeout(
                function() {

                    islemPanelKapat();

                    islemPanel.style.transform =
                        "";

                },
                250
            );

        }

        else {

            islemPanel.style.transform =
                "translate(-50%, 0)";

        }


        baslangicY = 0;

        mevcutY = 0;

    }
);


</script>

</body>
</html>
