<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mesajlarım - NETmax Gayrimenkul</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="js/ilanlar.js"></script>

<script type="module">

    import { initializeApp } 
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import { getAuth, signInAnonymously } 
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBVMw9NS3R49xqnVLgmlAiSvTtYXFrHwB0",
        authDomain: "netmax-mesajlar.firebaseapp.com",
        databaseURL: "https://netmax-mesajlar-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "netmax-mesajlar",
        storageBucket: "netmax-mesajlar.firebasestorage.app",
        messagingSenderId: "575038344835",
        appId: "1:575038344835:web:513417e69f4a291dc095b6"
    };

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    signInAnonymously(auth)
        .then((userCredential) => {

            window.firebaseKullanici =
                userCredential.user;

            console.log(
                "MESAJLAR FIREBASE BAĞLANDI"
            );

            console.log(
                "UID:",
                userCredential.user.uid
            );

        })
        .catch((error) => {

            console.error(
                "MESAJLAR FIREBASE HATASI:",
                error
            );

        });

</script>
<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f5;
    font-family: 'Titillium Web', sans-serif;
}

/* ANA KAPSÜL */

.mesajlar-container {
    width: 100%;
    max-width: 600px;
    min-height: 100vh;
    margin: auto;
    background: white;
    position: relative;
}

/* ÜST BAŞLIK */

.mesajlar-header {
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 15px;
    background: white;
    border-bottom: 1px solid #eee;
    font-size: 20px;
    font-weight: bold;
}

.mesajlar-header i {
    margin-right: 12px;
    color: #2563eb;
}

/* İLAN LİSTESİ */

.mesaj-ilan-listesi {
    width: 100%;
}

/* İLAN SATIRI */

.mesaj-ilan {
    width: 100%;
    min-height: 85px;
    display: flex;
    align-items: center;
    padding: 10px 15px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    background: white;
}

.mesaj-ilan:hover {
    background: #f8fafc;
}

/* İLAN RESMİ */

.mesaj-ilan-resim {
    width: 65px;
    height: 65px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
}

/* İLAN BİLGİSİ */

.mesaj-ilan-bilgi {
    flex: 1;
    min-width: 0;
    margin-left: 12px;
}

.mesaj-ilan-baslik {
    font-size: 16px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.mesaj-ilan-alt {
    font-size: 14px;
    color: #777;
    margin-top: 3px;
}

/* SAĞ OK */

.mesaj-ilan-ok {
    margin-left: 10px;
    color: #999;
    font-size: 18px;
}

/* BOŞ MESAJ */

.mesaj-bos {
    padding: 50px 20px;
    text-align: center;
    color: #888;
}

.mesaj-bos i {
    font-size: 45px;
    margin-bottom: 15px;
}

/* SOHBET */

.sohbet-ekrani {
    display: none;
    position: fixed;
    inset: 0;
    background: #f5f5f5;
    z-index: 10000;
}

/* SOHBET ÜST */

.sohbet-header {
    width: 100%;
    max-width: 600px;
    margin: auto;
    height: 70px;
    display: flex;
    align-items: center;
    padding: 8px 12px;
    background: white;
    border-bottom: 1px solid #ddd;
}

.sohbet-geri {
    width: 40px;
    font-size: 22px;
    cursor: pointer;
}

.sohbet-ilan-resim {
    width: 50px;
    height: 50px;
    border-radius: 7px;
    object-fit: cover;
}

.sohbet-ilan-bilgi {
    margin-left: 10px;
    min-width: 0;
}

.sohbet-ilan-baslik {
    font-weight: bold;
    font-size: 16px;
}

.sohbet-ilan-alt {
    font-size: 13px;
    color: #777;
}

/* MESAJ ALANI */

.sohbet-mesajlar {
    width: 100%;
    max-width: 600px;
    margin: auto;
    height: calc(100vh - 130px);
    overflow-y: auto;
    padding: 15px;
}

/* MESAJ BALONLARI */

.mesaj-balonu {
    max-width: 78%;
    padding: 9px 12px;
    border-radius: 10px;
    margin-bottom: 10px;
    font-size: 15px;
    line-height: 1.4;
}

.mesaj-gelen {
    background: white;
    margin-right: auto;
}

.mesaj-giden {
    background: #2563eb;
    color: white;
    margin-left: auto;
}

.mesaj-saat {
    display: block;
    font-size: 11px;
    margin-top: 4px;
    opacity: .65;
    text-align: right;
}

/* MESAJ GÖNDERME */

.mesaj-gonder-panel {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 600px;
    height: 60px;
    background: white;
    border-top: 1px solid #ddd;
    display: flex;
    align-items: center;
    padding: 8px 10px;
}

.mesaj-input {
    flex: 1;
    height: 42px;
    border: 1px solid #ddd;
    border-radius: 21px;
    padding: 0 15px;
    font-family: inherit;
    font-size: 15px;
    outline: none;
}

.mesaj-gonder {
    width: 42px;
    height: 42px;
    margin-left: 8px;
    border: none;
    border-radius: 50%;
    background: #2563eb;
    color: white;
    font-size: 17px;
    cursor: pointer;
}



@media (max-width: 600px) {

    body {
        background: white;
    }

    .mesajlar-container {
        width: 100%;
        max-width: none;
        min-height: 100dvh;
    }

    .mesajlar-header {
        height: 56px;
        padding: 0 14px;
        font-size: 18px;
    }

    .mesaj-ilan {
        min-height: 78px;
        padding: 8px 12px;
    }

    .mesaj-ilan-resim {
        width: 58px;
        height: 58px;
        border-radius: 7px;
    }

    .mesaj-ilan-bilgi {
        margin-left: 10px;
    }

    .mesaj-ilan-baslik {
        font-size: 15px;
    }

    .mesaj-ilan-alt {
        font-size: 13px;
    }

    .mesaj-ilan-ok {
        font-size: 16px;
        margin-left: 7px;
    }

    .sohbet-header {
        max-width: none;
        height: 62px;
        padding: 6px 8px;
    }

    .sohbet-geri {
        width: 38px;
        font-size: 20px;
    }

    .sohbet-ilan-resim {
        width: 45px;
        height: 45px;
    }

    .sohbet-ilan-baslik {
        font-size: 15px;
    }

    .sohbet-ilan-alt {
        font-size: 12px;
    }

    .sohbet-mesajlar {
        max-width: none;
        height: calc(100dvh - 122px);
        padding: 12px;
    }

    .mesaj-balonu {
        max-width: 82%;
        font-size: 14px;
    }

    .mesaj-gonder-panel {
        max-width: none;
        height: 60px;
        padding: 8px;
    }

    .mesaj-input {
        height: 42px;
        font-size: 14px;
    }

    .mesaj-gonder {
        width: 42px;
        height: 42px;
        flex-shrink: 0;
    }

}

</style>
</head>

<body>

<div class="mesajlar-container">

    <div class="mesajlar-header">
        <i class="fa-solid fa-comments"></i>
        Mesajlarım
    </div>

    <div id="mesajIlanListesi" class="mesaj-ilan-listesi">

        <div class="mesaj-bos">
            <i class="fa-regular fa-comment-dots"></i>
            <div>Henüz mesajınız yok.</div>
        </div>

    </div>

</div>


<!-- SOHBET EKRANI -->

<div id="sohbetEkrani" class="sohbet-ekrani">

    <div class="sohbet-header">

        <div class="sohbet-geri" onclick="sohbetKapat()">
            <i class="fa-solid fa-arrow-left"></i>
        </div>

        <img id="sohbetIlanResim"
             class="sohbet-ilan-resim"
             src="">

        <div class="sohbet-ilan-bilgi">

            <div id="sohbetIlanBaslik"
                 class="sohbet-ilan-baslik">
            </div>

            <div id="sohbetIlanAlt"
                 class="sohbet-ilan-alt">
            </div>

        </div>

    </div>


    <div id="sohbetMesajlar"
         class="sohbet-mesajlar">
    </div>


    <div class="mesaj-gonder-panel">

        <input
            id="mesajInput"
            class="mesaj-input"
            type="text"
            placeholder="Mesajınızı yazın..."
        >

        <button
            class="mesaj-gonder"
            onclick="mesajGonder()">

            <i class="fa-solid fa-paper-plane"></i>

        </button>

    </div>

</div>


<script>

const urlParams = new URLSearchParams(window.location.search);

const gelenIlanID = urlParams.get("ilan");

let aktifIlan = null;


// İLANI BUL
if (gelenIlanID && typeof ilanlarVerisi !== "undefined") {

    aktifIlan = ilanlarVerisi.find(
        ilan => String(ilan.id) === String(gelenIlanID)
    );

}

console.log("GELEN İLAN ID:", gelenIlanID);
console.log("AKTİF İLAN:", aktifIlan);


// İLAN BULUNDUYSA
if (aktifIlan) {

    // -----------------------------
    // İLAN RESMİ
    // -----------------------------

    const resim =
        aktifIlan.resimler &&
        aktifIlan.resimler.length > 0
            ? aktifIlan.resimler[0]
            : "";

    document.getElementById("sohbetIlanResim").src = resim;


    // -----------------------------
    // İLAN BAŞLIĞI
    // -----------------------------

    let kartBaslik = "";

    kartBaslik += aktifIlan.baslik || "";


    // DURUM

    if (aktifIlan.durum === "satilik") {

        kartBaslik += " SATILIK";

    }

    else if (aktifIlan.durum === "kiralik") {

        kartBaslik += " KİRALIK";

    }

    else if (aktifIlan.durum === "kat-karsiligi") {

        kartBaslik += " KAT KARŞILIĞI";

    }


    // DAİRE

    if (
        aktifIlan.konutSekli &&
        aktifIlan.konutSekli.toLowerCase() === "daire"
    ) {

        kartBaslik += " Daire";

    }


    // DÜKKAN

    else if (
        aktifIlan.konutTipi &&
        aktifIlan.konutTipi.toLowerCase() === "dükkan"
    ) {

        kartBaslik += " Dükkan";

    }


    // VİLLA

    else if (
        (
            aktifIlan.konutTipi &&
            aktifIlan.konutTipi.toLowerCase() === "villa"
        )
        ||
        (
            aktifIlan.konutSekli &&
            aktifIlan.konutSekli.toLowerCase() === "villa"
        )
    ) {

        kartBaslik += " Villa";

    }


    // ARSA / TARLA

    else if (
        aktifIlan.tip &&
        (
            aktifIlan.tip.toLowerCase() === "arsa" ||
            aktifIlan.tip.toLowerCase() === "tarla"
        )
    ) {

        kartBaslik +=
            " " +
            aktifIlan.tip.charAt(0).toUpperCase() +
            aktifIlan.tip.slice(1).toLowerCase();

    }


    // SADECE DAİREDE ODA SAYISI

    if (
        aktifIlan.konutSekli &&
        aktifIlan.konutSekli.toLowerCase() === "daire" &&
        aktifIlan["Oda Sayısı"]
    ) {

        kartBaslik +=
            " " + aktifIlan["Oda Sayısı"];

    }


    // BAŞLIK

    document.getElementById("sohbetIlanBaslik").textContent =
        kartBaslik;


    // -----------------------------
    // FİYAT
    // -----------------------------

    document.getElementById("sohbetIlanAlt").textContent =
        aktifIlan.fiyat
            ? aktifIlan.fiyat + " " +
              (aktifIlan.paraBirimi || "")
            : "";


    // -----------------------------
    // SOHBETİ AÇ
    // -----------------------------

    document.getElementById("sohbetEkrani").style.display =
        "block";

}


// -----------------------------
// SOHBETİ KAPAT
// -----------------------------

function sohbetKapat() {

    document.getElementById("sohbetEkrani").style.display =
        "none";

}


// -----------------------------
// MESAJ GÖNDER
// -----------------------------

function mesajGonder() {

    const input =
        document.getElementById("mesajInput");

    const mesaj =
        input.value.trim();

    if (!mesaj) return;

    console.log(
        "Gönderilecek mesaj:",
        mesaj
    );

    input.value = "";

}

</script>

</body>
</html>
