<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mesajlarım - NETmax Gayrimenkul</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="js/ilanlar.js"></script>

<script type="module">

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getAuth,
    signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyBVMw9NS3R49xqnVLgmlAiSvTtYXFrHwB0",

    authDomain:
        "netmax-mesajlar.firebaseapp.com",

    databaseURL:
        "https://netmax-mesajlar-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "netmax-mesajlar",

    storageBucket:
        "netmax-mesajlar.firebasestorage.app",

    messagingSenderId:
        "575038344835",

    appId:
        "1:575038344835:web:513417e69f4a291dc095b6"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


signInAnonymously(auth)

.then((userCredential) => {

    window.firebaseKullanici =
        userCredential.user;

    console.log(
        "MESAJLAR FIREBASE BAĞLANDI"
    );

    console.log(
        "UID:",
        userCredential.user.uid
    );

})

.catch((error) => {

    console.error(
        "MESAJLAR FIREBASE HATASI:",
        error
    );

});

</script>


<style>

/* =====================================================
   GENEL
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    background: #f5f5f5;

    font-family:
        'Titillium Web',
        Arial,
        sans-serif;

    overflow-x: hidden;
}


/* =====================================================
   ANA MESAJLAR ALANI
===================================================== */

.mesajlar-container {

    width: 100%;
    max-width: 600px;

    min-height: 100vh;

    margin: auto;

    background: #ffffff;

    position: relative;
}


/* =====================================================
   MESAJLAR ÜST BAŞLIK
===================================================== */

.mesajlar-header {

    height: 60px;

    display: flex;
    align-items: center;

    padding: 0 15px;

    background: #ffffff;

    border-bottom: 1px solid #eeeeee;

    font-size: 20px;
    font-weight: 700;
}

.mesajlar-header i {

    margin-right: 12px;

    color: #2563eb;

    font-size: 20px;
}


/* =====================================================
   İLAN / MESAJ LİSTESİ
===================================================== */

.mesaj-ilan-listesi {

    width: 100%;
}


/* =====================================================
   MESAJ SATIRI
===================================================== */

.mesaj-ilan {

    width: 100%;

    min-height: 85px;

    display: flex;
    align-items: center;

    padding: 10px 15px;

    border-bottom: 1px solid #eeeeee;

    cursor: pointer;

    background: #ffffff;

    transition:
        background .15s ease;
}

.mesaj-ilan:hover {

    background: #f8fafc;
}


/* =====================================================
   İLAN RESMİ
===================================================== */

.mesaj-ilan-resim {

    width: 65px;
    height: 65px;

    border-radius: 8px;

    object-fit: cover;

    flex-shrink: 0;
}


/* =====================================================
   İLAN BİLGİSİ
===================================================== */

.mesaj-ilan-bilgi {

    flex: 1;

    min-width: 0;

    margin-left: 12px;
}

.mesaj-ilan-baslik {

    font-size: 16px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.mesaj-ilan-alt {

    font-size: 14px;

    color: #777777;

    margin-top: 3px;
}


/* =====================================================
   SAĞ OK
===================================================== */

.mesaj-ilan-ok {

    margin-left: 10px;

    color: #999999;

    font-size: 18px;

    flex-shrink: 0;
}


/* =====================================================
   BOŞ MESAJ
===================================================== */

.mesaj-bos {

    padding: 50px 20px;

    text-align: center;

    color: #888888;
}

.mesaj-bos i {

    display: block;

    font-size: 45px;

    margin-bottom: 15px;
}


/* =====================================================
   SOHBET EKRANI
===================================================== */

.sohbet-ekrani {

    display: none;

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100dvh;

    background: #f5f5f5;

    z-index: 10000;

    overflow: hidden;
}


/* =====================================================
   SOHBET ÜST ALAN
===================================================== */

.sohbet-header {

    width: 100%;

    max-width: 600px;

    height: 64px;

    margin: auto;

    display: flex;

    align-items: center;

    padding: 0 12px;

    /*
       BURASI SENİN GÖRSELİNDEKİ
       ÜST ALAN RENGİ İÇİN.
    */

    background: #2563eb;

    color: #ffffff;

    position: relative;

    z-index: 10;
}


/* =====================================================
   GERİ < İŞARETİ
===================================================== */

.sohbet-geri {

    width: 42px;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: flex-start;

    cursor: pointer;

    flex-shrink: 0;
}


/*
   FA OK KULLANMIYORUZ.

   SADECE BEYAZ <
*/

.sohbet-geri-isareti {

    color: #ffffff;

    font-size: 34px;

    font-family: Arial, sans-serif;

    font-weight: 300;

    line-height: 1;

    margin-left: 2px;

    user-select: none;
}


/* =====================================================
   İRTİBAT BİLGİSİ
===================================================== */

.sohbet-irtibat-alani {

    flex: 1;

    min-width: 0;

    padding: 0 8px;
}

.sohbet-irtibat {

    color: #ffffff;

    font-size: 17px;

    font-weight: 600;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/*
   Firebase'den numara gelene kadar
*/

.sohbet-irtibat.bos {

    opacity: .85;
}


/* =====================================================
   SAĞ ÜST ...
===================================================== */

.sohbet-islemler-buton {

    width: 42px;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    flex-shrink: 0;

    color: #ffffff;

    font-size: 22px;

    user-select: none;
}

.sohbet-islemler-buton:active {

    opacity: .7;
}


/* =====================================================
   MESAJ ALANI
===================================================== */

.sohbet-mesajlar {

    width: 100%;

    max-width: 600px;

    margin: auto;

    height: calc(100dvh - 124px);

    overflow-y: auto;

    padding: 15px;

    background: #f5f5f5;

    scroll-behavior: smooth;
}


/* =====================================================
   MESAJ BALONLARI
===================================================== */

.mesaj-balonu {

    max-width: 78%;

    padding: 9px 12px;

    border-radius: 10px;

    margin-bottom: 10px;

    font-size: 15px;

    line-height: 1.4;

    word-wrap: break-word;
}


/* GELEN */

.mesaj-gelen {

    background: #ffffff;

    color: #222222;

    margin-right: auto;

    border-bottom-left-radius: 3px;
}


/* GİDEN */

.mesaj-giden {

    background: #2563eb;

    color: #ffffff;

    margin-left: auto;

    border-bottom-right-radius: 3px;
}


/* SAAT */

.mesaj-saat {

    display: block;

    font-size: 11px;

    margin-top: 4px;

    opacity: .65;

    text-align: right;
}


/* =====================================================
   MESAJ GÖNDERME PANELİ
===================================================== */

.mesaj-gonder-panel {

    position: fixed;

    bottom: 0;

    left: 50%;

    transform: translateX(-50%);

    width: 100%;

    max-width: 600px;

    height: 60px;

    background: #ffffff;

    border-top: 1px solid #dddddd;

    display: flex;

    align-items: center;

    padding: 8px 10px;

    z-index: 20;
}


/* INPUT */

.mesaj-input {

    flex: 1;

    height: 42px;

    border: 1px solid #dddddd;

    border-radius: 21px;

    padding: 0 15px;

    font-family: inherit;

    font-size: 15px;

    outline: none;

    background: #ffffff;
}

.mesaj-input:focus {

    border-color: #2563eb;
}


/* GÖNDER */

.mesaj-gonder {

    width: 42px;
    height: 42px;

    margin-left: 8px;

    border: none;

    border-radius: 50%;

    background: #2563eb;

    color: #ffffff;

    font-size: 17px;

    cursor: pointer;

    flex-shrink: 0;
}


/* =====================================================
   İŞLEM PANELİ ARKA PLAN KARARTMA
===================================================== */

.islem-overlay {

    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, .35);

    z-index: 30000;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity .22s ease,
        visibility .22s ease;
}

.islem-overlay.acik {

    opacity: 1;

    visibility: visible;
}


/* =====================================================
   ALTTAN GELEN İŞLEM PANELİ
===================================================== */

.islem-panel {

    position: fixed;

    left: 50%;

    bottom: 0;

    transform:
        translate(-50%, 100%);

    width: 100%;

    max-width: 600px;

    background: #ffffff;

    border-radius:
        18px 18px 0 0;

    z-index: 30001;

    box-shadow:
        0 -5px 25px rgba(0,0,0,.15);

    transition:
        transform .25s ease;

    overflow: hidden;

    padding-bottom:
        env(safe-area-inset-bottom);
}

.islem-panel.acik {

    transform:
        translate(-50%, 0);
}


/* =====================================================
   PANEL ÜST SÜRÜKLEME ÇİZGİSİ
===================================================== */

.islem-surukle {

    width: 42px;
    height: 5px;

    border-radius: 10px;

    background: #c7c7c7;

    margin:
        9px auto 8px;

    cursor: grab;
}


/* =====================================================
   İŞLEMLER BAŞLIĞI
===================================================== */

.islem-baslik {

    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 16px;

    font-weight: 700;

    color: #222222;
}


/* =====================================================
   AYIRICI ÇİZGİ
===================================================== */

.islem-cizgi {

    width: 100%;

    height: 1px;

    background: #eeeeee;
}


/* =====================================================
   MESAJI SİL
===================================================== */

.mesaj-sil {

    width: 100%;

    height: 52px;

    display: flex;

    align-items: center;

    justify-content: flex-start;

    padding: 0 20px;

    background: #ffffff;

    border: none;

    color: #e11d48;

    font-family: inherit;

    font-size: 16px;

    cursor: pointer;

    text-align: left;
}

.mesaj-sil:active {

    background: #f8f8f8;
}

.mesaj-sil i {

    width: 27px;

    font-size: 16px;

    margin-right: 8px;
}


/* =====================================================
   MOBİL
===================================================== */

@media (max-width: 600px) {

    body {

        background: #ffffff;
    }


    .mesajlar-container {

        width: 100%;

        max-width: none;

        min-height: 100dvh;
    }


    .mesajlar-header {

        height: 56px;

        padding: 0 14px;

        font-size: 18px;
    }


    .mesaj-ilan {

        min-height: 78px;

        padding: 8px 12px;
    }


    .mesaj-ilan-resim {

        width: 58px;
        height: 58px;

        border-radius: 7px;
    }


    .mesaj-ilan-bilgi {

        margin-left: 10px;
    }


    .mesaj-ilan-baslik {

        font-size: 15px;
    }


    .mesaj-ilan-alt {

        font-size: 13px;
    }


    .mesaj-ilan-ok {

        font-size: 16px;

        margin-left: 7px;
    }


    .sohbet-header {

        max-width: none;

        height: 62px;

        padding: 0 8px;
    }


    .sohbet-geri {

        width: 40px;
    }


    .sohbet-geri-isareti {

        font-size: 32px;
    }


    .sohbet-irtibat {

        font-size: 16px;
    }


    .sohbet-islemler-buton {

        width: 40px;

        font-size: 21px;
    }


    .sohbet-mesajlar {

        max-width: none;

        height:
            calc(100dvh - 122px);

        padding: 12px;
    }


    .mesaj-balonu {

        max-width: 82%;

        font-size: 14px;
    }


    .mesaj-gonder-panel {

        max-width: none;

        height: 60px;

        padding: 8px;
    }


    .mesaj-input {

        height: 42px;

        font-size: 14px;
    }


    .mesaj-gonder {

        width: 42px;
        height: 42px;
    }


    .islem-panel {

        max-width: none;

        border-radius:
            18px 18px 0 0;
    }

}


/* =====================================================
   KÜÇÜK EKRANLAR
===================================================== */

@media (max-width: 380px) {

    .sohbet-irtibat {

        font-size: 15px;
    }

    .mesaj-balonu {

        max-width: 86%;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     MESAJLARIM
===================================================== -->

<div class="mesajlar-container">


    <div class="mesajlar-header">

        <i class="fa-solid fa-comments"></i>

        Mesajlarım

    </div>


    <div
        id="mesajIlanListesi"
        class="mesaj-ilan-listesi"
    >

        <div class="mesaj-bos">

            <i class="fa-regular fa-comment-dots"></i>

            <div>
                Henüz mesajınız yok.
            </div>

        </div>

    </div>

</div>



<!-- =====================================================
     SOHBET EKRANI
===================================================== -->

<div
    id="sohbetEkrani"
    class="sohbet-ekrani"
>


    <!-- ÜST ALAN -->

    <div class="sohbet-header">


        <!-- GERİ < -->

        <div
            class="sohbet-geri"
            onclick="sohbetKapat()"
        >

            <span class="sohbet-geri-isareti">
                &lt;
            </span>

        </div>


        <!-- FIREBASE İRTİBAT -->

        <div class="sohbet-irtibat-alani">

            <div
                id="sohbetIrtibat"
                class="sohbet-irtibat bos"
            >
                İrtibat
            </div>

        </div>


        <!-- ... -->

        <div
            class="sohbet-islemler-buton"
            onclick="islemPanelAc()"
        >

            <i class="fa-solid fa-ellipsis"></i>

        </div>


    </div>



    <!-- MESAJLAR -->

    <div
        id="sohbetMesajlar"
        class="sohbet-mesajlar"
    >
    </div>



    <!-- MESAJ YAZMA -->

    <div class="mesaj-gonder-panel">


        <input
            id="mesajInput"
            class="mesaj-input"
            type="text"
            placeholder="Mesajınızı yazın..."
        >


        <button
            class="mesaj-gonder"
            onclick="mesajGonder()"
        >

            <i class="fa-solid fa-paper-plane"></i>

        </button>


    </div>


</div>



<!-- =====================================================
     İŞLEM PANELİ KARARTMASI
===================================================== -->

<div
    id="islemOverlay"
    class="islem-overlay"
    onclick="islemPanelKapat()"
></div>



<!-- =====================================================
     ALTTAN AÇILAN İŞLEM PANELİ
===================================================== -->

<div
    id="islemPanel"
    class="islem-panel"
>


    <!-- SÜRÜKLEME ÇİZGİSİ -->

    <div
        class="islem-surukle"
        id="islemSurukle"
    ></div>


    <!-- BAŞLIK -->

    <div class="islem-baslik">

        İşlemler

    </div>


    <!-- AYIRICI -->

    <div class="islem-cizgi"></div>


    <!-- MESAJI SİL -->

    <button
        class="mesaj-sil"
        onclick="mesajSilTiklandi()"
    >

        <i class="fa-regular fa-trash-can"></i>

        <span>
            Mesajı sil
        </span>

    </button>


</div>



<script>

/* =====================================================
   URL
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const gelenIlanID =
    urlParams.get("ilan");


let aktifIlan = null;


/* =====================================================
   İLANI BUL
===================================================== */

if (
    gelenIlanID &&
    typeof ilanlarVerisi !== "undefined"
) {

    aktifIlan =
        ilanlarVerisi.find(
            ilan =>
                String(ilan.id) ===
                String(gelenIlanID)
        );

}


console.log(
    "GELEN İLAN ID:",
    gelenIlanID
);

console.log(
    "AKTİF İLAN:",
    aktifIlan
);


/* =====================================================
   İLAN BULUNDUYSA
===================================================== */

if (aktifIlan) {


    /*
       Burada artık sohbet üstünde
       ilan bilgisi göstermiyoruz.

       İrtibat bilgisi Firebase'den
       gelecek.
    */


    /*
       Daha sonra Firebase'den gelen
       konuşma nesnesi buraya bağlanacak.

       Örnek:

       aktifKonusma.irtibat

       veya

       aktifKonusma.telefon
    */

}


/* =====================================================
   FIREBASE'DEN İRTİBAT GELDİĞİNDE
   KULLANILACAK FONKSİYON
===================================================== */

function irtibatGoster(irtibat) {

    const alan =
        document.getElementById(
            "sohbetIrtibat"
        );


    if (
        irtibat &&
        String(irtibat).trim()
    ) {

        alan.textContent =
            String(irtibat).trim();

        alan.classList.remove("bos");

    }

    else {

        alan.textContent =
            "İrtibat";

        alan.classList.add("bos");

    }

}


/* =====================================================
   SOHBETİ KAPAT
===================================================== */

function sohbetKapat() {

    document.getElementById(
        "sohbetEkrani"
    ).style.display = "none";


    islemPanelKapat();

}


/* =====================================================
   İŞLEM PANELİNİ AÇ
===================================================== */

function islemPanelAc() {

    const panel =
        document.getElementById(
            "islemPanel"
        );

    const overlay =
        document.getElementById(
            "islemOverlay"
        );


    panel.classList.add("acik");

    overlay.classList.add("acik");

}


/* =====================================================
   İŞLEM PANELİNİ KAPAT
===================================================== */

function islemPanelKapat() {

    const panel =
        document.getElementById(
            "islemPanel"
        );

    const overlay =
        document.getElementById(
            "islemOverlay"
        );


    panel.classList.remove("acik");

    overlay.classList.remove("acik");

}


/* =====================================================
   MESAJI SİL
===================================================== */

function mesajSilTiklandi() {

    /*
       ŞİMDİLİK SADECE PANEL KAPANIYOR.

       Firebase'deki gerçek silme işlemini
       sonraki aşamada bağlayacağız.
    */

    islemPanelKapat();

    console.log(
        "MESAJI SİL TIKLANDI"
    );

}


/* =====================================================
   MESAJ GÖNDER
===================================================== */

function mesajGonder() {

    const input =
        document.getElementById(
            "mesajInput"
        );


    const mesaj =
        input.value.trim();


    if (!mesaj) return;


    console.log(
        "Gönderilecek mesaj:",
        mesaj
    );


    input.value = "";

}


/* =====================================================
   ENTER İLE GÖNDER
===================================================== */

document
    .getElementById("mesajInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                mesajGonder();

            }

        }
    );


/* =====================================================
   PANELİ AŞAĞI SÜRÜKLEME
===================================================== */

const panel =
    document.getElementById(
        "islemPanel"
    );

const surukle =
    document.getElementById(
        "islemSurukle"
    );


let dokunmaBaslangicY = 0;

let dokunmaY = 0;

let panelSurukleniyor = false;


surukle.addEventListener(
    "touchstart",
    function(event) {

        dokunmaBaslangicY =
            event.touches[0].clientY;

        panelSurukleniyor = true;

        panel.style.transition = "none";

    },
    { passive: true }
);


surukle.addEventListener(
    "touchmove",
    function(event) {

        if (!panelSurukleniyor) return;


        dokunmaY =
            event.touches[0].clientY;


        const fark =
            dokunmaY -
            dokunmaBaslangicY;


        if (fark > 0) {

            panel.style.transform =
                `translate(-50%, ${fark}px)`;

        }

    },
    { passive: true }
);


surukle.addEventListener(
    "touchend",
    function() {

        if (!panelSurukleniyor) return;


        panelSurukleniyor = false;


        const fark =
            dokunmaY -
            dokunmaBaslangicY;


        panel.style.transition =
            "transform .25s ease";


        if (fark > 80) {

            panel.style.transform =
                "translate(-50%, 100%)";


            setTimeout(
                () => {

                    islemPanelKapat();

                    panel.style.transform = "";

                },
                250
            );

        }

        else {

            panel.style.transform =
                "translate(-50%, 0)";

        }


        dokunmaBaslangicY = 0;

        dokunmaY = 0;

    }
);


/* =====================================================
   BAŞLANGIÇ
===================================================== */

console.log(
    "MESAJLAR SAYFASI HAZIR"
);

</script>


</body>
</html>
