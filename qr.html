<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ENNETmax İlan QR</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

@page {
    size: A4;
    margin: 0;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #e5e7eb;
    font-family: Tahoma, Arial, sans-serif;
}


/* =====================================================
   A4 SAYFA
===================================================== */

.a4 {
    width: 210mm;
    height: 297mm;

    margin: 20px auto;

    background: #ffffff;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;

    padding: 25mm 20mm;

    box-shadow: 0 5px 25px rgba(0,0,0,.18);

    position: relative;
}


/* =====================================================
   ENNETmax GAYRİMENKUL
===================================================== */

.logo {

    font-size: 36px;

    font-weight: bold;

    letter-spacing: 1px;

    margin-top: 5mm;

    margin-bottom: 18mm;

}


/* =====================================================
   ANA BAŞLIK
===================================================== */

.baslik {

    font-size: 34px;

    font-weight: bold;

    margin-bottom: 8mm;

}


/* =====================================================
   AÇIKLAMA
===================================================== */

.aciklama {

    font-size: 21px;

    line-height: 1.7;

    color: #333;

    margin-bottom: 14mm;

}


/* =====================================================
   QR
===================================================== */

.qr-cerceve {

    padding: 8mm;

    background: #fff;

    border: 1px solid #cfcfcf;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

}


#qrcode {

    width: 90mm;

    height: 90mm;

    display: flex;

    align-items: center;

    justify-content: center;

}


#qrcode img {

    width: 90mm !important;

    height: 90mm !important;

    display: block;

}


/* =====================================================
   İLAN NUMARASI
===================================================== */

.ilan-no {

    margin-top: 12mm;

    font-size: 22px;

    font-weight: bold;

}


/* =====================================================
   ALT YAZI
===================================================== */

.alt-yazi {

    margin-top: 7mm;

    font-size: 20px;

    color: #444;

}


/* =====================================================
   YAZDIR
===================================================== */

.yazdir {

    margin-top: 18mm;

    padding: 14px 35px;

    border: none;

    border-radius: 8px;

    background: #1e3a8a;

    color: #fff;

    font-family: Tahoma, Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

}


.yazdir:hover {

    opacity: .9;

}


/* =====================================================
   YAZDIRMA
===================================================== */

@media print {

    html,
    body {

        width: 210mm;

        height: 297mm;

        margin: 0;

        padding: 0;

        background: #fff;

    }


    .a4 {

        width: 210mm;

        height: 297mm;

        margin: 0;

        padding: 25mm 20mm;

        box-shadow: none;

    }


    .yazdir {

        display: none;

    }

}

</style>

</head>

<body>

<div class="a4">


<div class="logo">

    ENNETmax GAYRİMENKUL

</div>


<div class="baslik">

    İLANI GÖRÜNTÜLE

</div>


<div class="aciklama">

    İlanı telefonunuzdan görüntülemek için<br>

    aşağıdaki QR kodu okutunuz.

</div>


<div class="qr-cerceve">

    <div id="qrcode"></div>

</div>


<div class="ilan-no">

    İlan No: 1785871007246

</div>


<div class="alt-yazi">

    Telefonunuzun kamerasıyla okutabilirsiniz.

</div>


<button
    class="yazdir"
    onclick="window.print()">

    A4 OLARAK YAZDIR

</button>


</div>

<script>


/* =====================================================
   İLAN ID
===================================================== */

const ilanID =
    "1785871007246";


/* =====================================================
   QR'IN AÇACAĞI ADRES
===================================================== */

const ilanURL =
    "https://ademcolak68-debug.github.io/saha_ilanlar/ilan.html?id="
    + ilanID
    + "&kategoriler=1";


/* =====================================================
   QR OLUŞTUR
===================================================== */

new QRCode(

    document.getElementById("qrcode"),

    {

        text: ilanURL,

        width: 500,

        height: 500,

        correctLevel:
            QRCode.CorrectLevel.H

    }

);

</script>

</body>

</html>
