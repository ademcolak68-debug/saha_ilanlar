<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<title>NETmax İlan QR Kodu</title>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
</script>

<style>

@page {
    size: A4;
    margin: 0;
}


* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #eee;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

}


.a4 {

    width: 210mm;

    height: 297mm;

    margin: 20px auto;

    background: #fff;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;

    padding-top: 35mm;

}


.logo {

    font-size: 30px;

    font-weight: bold;

    margin-bottom: 18mm;

}


.baslik {

    font-size: 28px;

    font-weight: bold;

    margin-bottom: 8mm;

}


.aciklama {

    font-size: 18px;

    margin-bottom: 15mm;

}


#qrcode {

    width: 90mm;

    height: 90mm;

    display: flex;

    align-items: center;

    justify-content: center;

}


#qrcode img {

    width: 90mm !important;

    height: 90mm !important;

}


.ilan-no {

    margin-top: 15mm;

    font-size: 18px;

    font-weight: bold;

}


.alt-yazi {

    margin-top: 8mm;

    font-size: 17px;

}


.yazdir {

    margin-top: 20mm;

    padding: 12px 28px;

    border: none;

    border-radius: 8px;

    background: #1e3a8a;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


@media print {

    body {

        background: white;

    }


    .a4 {

        margin: 0;

        width: 210mm;

        height: 297mm;

        box-shadow: none;

    }


    .yazdir {

        display: none;

    }

}

</style>

</head>

<body>

<div class="a4">

```
<div class="logo">

    NETmax GAYRİMENKUL

</div>


<div class="baslik">

    İLANI GÖRÜNTÜLE

</div>


<div class="aciklama">

    İlanı telefonunuzdan görüntülemek için<br>
    QR kodu okutunuz.

</div>


<div id="qrcode"></div>


<div class="ilan-no">

    İlan No: 1785871007246

</div>


<div class="alt-yazi">

    Telefonunuzun kamerasıyla okutabilirsiniz.

</div>


<button
    class="yazdir"
    onclick="window.print()">

    A4 OLARAK YAZDIR

</button>
```

</div>

<script>


/*
=====================================================
BU QR KODUNUN AÇACAĞI İLAN
=====================================================
*/


const ilanID =
    "1785871007246";


const ilanURL =
    "https://ademcolak68-debug.github.io/saha_ilanlar/ilan.html?id="
    + ilanID;


/*
=====================================================
QR KODU OLUŞTUR
=====================================================
*/


new QRCode(

    document.getElementById(
        "qrcode"
    ),

    {

        text:
            ilanURL,

        width:
            500,

        height:
            500,

        correctLevel:
            QRCode.CorrectLevel.H

    }

);

</script>

</body>

</html>
