<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Yetki Doğrulama</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f5f6;
}


/* =========================================
   BELGE
   ========================================= */

.belge{

    width:calc(100% - 20px);
    max-width:600px;

    margin:12px auto;

    background:#fff;

    border-radius:8px;

    overflow:hidden;

    box-shadow:
        0 4px 18px rgba(0,0,0,.12);

}


/* =========================================
   ÜST BAŞLIK
   ========================================= */

.belge-ust{

    height:58px;

    display:flex;

    align-items:center;

    justify-content:flex-end;

    padding:0 22px;

    border-bottom:1px solid #eee;

}


.firma{

    color:#777;

    font-size:20px;

    letter-spacing:.8px;

    white-space:nowrap;

}


.firma strong{

    color:#8b6a25;

    font-weight:500;

}


/* =========================================
   KİŞİ ALANI
   ========================================= */

.kisi{

    height:190px;

    display:flex;

    align-items:center;

    gap:28px;

    padding:20px 25px;

}


.kisi-resim{

    width:150px;

    height:145px;

    flex-shrink:0;

    background:#eef0f1;

    overflow:hidden;

}


.kisi-resim img{

    width:100%;
    height:100%;

    object-fit:cover;

}


.kisi-adi{

    font-size:27px;

    font-weight:bold;

    color:#303030;

}


/* =========================================
   YETKİ BELGE NO
   ========================================= */

.yetki-no{

    height:65px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 25px;

    border-top:1px solid #eee;

    border-bottom:1px solid #eee;

}


.yetki-no .baslik{

    font-size:22px;

    color:#666;

}


.yetki-no .numara{

    font-size:25px;

    color:#555;

    font-weight:500;

}


/* =========================================
   EİDS
   ========================================= */

.eids{

    min-height:145px;

    display:flex;

    align-items:center;

    gap:25px;

    padding:18px 25px 22px;

}


.eids-logo{

    width:105px;

    height:105px;

    object-fit:cover;

    flex-shrink:0;

    border-radius:50%;

}


.eids-yazi{

    font-size:20px;

    line-height:1.35;

    color:#666;

}


.eids-yazi strong{

    color:#555;

}


/* =========================================
   ALT
   ========================================= */

.alt{

    height:28px;

    border-top:1px solid #eee;

    color:#aaa;

    font-size:10px;

    display:flex;

    align-items:center;

    justify-content:center;

}


/* =========================================
   YETKİSİZ
   ========================================= */

.pasif{

    width:calc(100% - 30px);

    max-width:450px;

    margin:70px auto;

    padding:35px 25px;

    background:#fff;

    text-align:center;

    border-radius:12px;

    box-shadow:
        0 4px 18px rgba(0,0,0,.12);

    border-top:4px solid #b83245;

}


.pasif-baslik{

    color:#b83245;

    font-size:23px;

    font-weight:bold;

    margin-bottom:15px;

}


.pasif-yazi{

    color:#777;

    font-size:15px;

    line-height:1.5;

}


/* =========================================
   TELEFON
   ========================================= */

@media(max-width:480px){

    .belge{

        width:calc(100% - 12px);

        margin:6px auto;

    }


    .belge-ust{

        height:45px;

        padding:0 12px;

    }


    .firma{

        font-size:15px;

    }


    .kisi{

        height:145px;

        gap:16px;

        padding:12px 14px;

    }


    .kisi-resim{

        width:115px;

        height:110px;

    }


    .kisi-adi{

        font-size:21px;

    }


    .yetki-no{

        height:52px;

        padding:0 14px;

    }


    .yetki-no .baslik{

        font-size:16px;

    }


    .yetki-no .numara{

        font-size:19px;

    }


    .eids{

        min-height:112px;

        gap:14px;

        padding:12px 14px;

    }


    .eids-logo{

        width:82px;

        height:82px;

    }


    .eids-yazi{

        font-size:14px;

        line-height:1.35;

    }


    .alt{

        height:20px;

        font-size:8px;

    }

}

</style>

</head>


<body>


<div id="sonuc">

    Kontrol ediliyor...

</div>


<script src="js/ilanlar.js"></script>


<script>


const id = Number(
    new URLSearchParams(location.search).get("id")
);


const ilan =
    ilanlarVerisi.find(x => x.id === id);


const sonuc =
    document.getElementById("sonuc");


/* =========================================
   YETKİLİ
   ========================================= */

if(
    ilan &&
    ilan.yetki &&
    ilan.yetki.durum
){

    sonuc.innerHTML = `

        <div class="belge">


            <div class="belge-ust">

                <div class="firma">

                    EN NET MAX GAYRİMENKUL

                </div>

            </div>


            <div class="kisi">


                <div class="kisi-resim">

                    <img
                        src="nedim-deniz-profil.jpg"
                        alt="Nedim Deniz"
                    >

                </div>


                <div class="kisi-adi">

                    Nedim Deniz

                </div>


            </div>


            <div class="yetki-no">

                <div class="baslik">

                    Yetki Belge No

                </div>


                <div class="numara">

                    6800330

                </div>

            </div>


            <div class="eids">


                <img
                    src="eids-logo.jpg"
                    class="eids-logo"
                    alt="EİDS"
                >


                <div class="eids-yazi">

                    Bu gayrimenkul için
                    <strong>Ticaret Bakanlığı</strong>
                    EİDS sisteminde ilan verme iznine
                    sahiptir.

                </div>


            </div>


            <div class="alt">

                Yetki doğrulama

            </div>


        </div>

    `;

}


/* =========================================
   YETKİSİZ
   ========================================= */

else{

    sonuc.innerHTML = `

        <div class="pasif">

            <div class="pasif-baslik">

                ✗ Yetki Pasif

            </div>


            <div class="pasif-yazi">

                Bu ilan için aktif yetkilendirme
                kaydı bulunmamaktadır.

            </div>

        </div>

    `;

}


</script>


</body>
</html>
