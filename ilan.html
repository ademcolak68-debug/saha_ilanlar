<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETmax Gayrimenkul</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
	
<style>
body{margin:0;background:#f4f4f4;font-family: Tahoma, sans-serif;color:#333}
.container{max-width:600px;margin:auto;background:#fff;min-height:100vh;padding-bottom:20px}

#acilisEkrani{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:99999;transition:opacity .5s}
#acilisEkrani img{width:230px;max-width:80%}
#acilisEkrani h2{margin-top:20px;font-size:24px;color:#1b4d3e}
#acilisEkrani p{margin-top:12px;color:#666;font-size:15px}
.yukleme-kapsul{width:220px;height:6px;background:#e5e5e5;border-radius:20px;overflow:hidden;margin-top:15px}
.yukleme-cubuk{width:0%;height:100%;background:#d4af37;animation:yukleAnimasyon 2.5s linear forwards}
@keyframes yukleAnimasyon{100%{width:100%}}

.header-top{padding:15px;font-size:16px;font-family: 'Titillium Web', sans-serif;text-align:center;border-bottom:1px solid #eee;text-transform:uppercase;line-height:1.4}
.firma-imza{font-size:14px;font-family: 'Titillium Web', sans-serif;font-weight:normal;text-align:center;padding:12px;background:#f9f9f9;border-bottom:1px solid #eee}

.slider-kapsul{position:relative}
.detay-slider{position:relative;width:100%;height:350px;background:#eee;overflow-x:auto;display:flex;scroll-snap-type:x mandatory}
.detay-resim{min-width:100%;height:100%;object-fit:cover;scroll-snap-align:start}

.slider-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);border:0;color:#fff;padding:15px 10px;cursor:pointer;font-size:22px;z-index:10;display:none}

.resim-sayac{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:4px 12px;border-radius:20px;font-size:13px}

@media(min-width:768px){.slider-btn{display:block}}

.tabs{display:flex;background:#eee;border-radius:8px;margin:15px;overflow:hidden}
.tab-btn{flex:1;padding:12px;border:0;background:#e0e0e0;cursor:pointer;font-weight:bold;color:#555;font-family: Tahoma, sans-serif;}
.tab-btn.active{background:#d4af37;color:#fff}
.tab-content{padding:0 15px;display:none;font-family: Tahoma, sans-serif;}
.tab-content.active{display:block}

.ozellik{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;font-family: Tahoma, sans-serif;}
.ozellik:first-child span,
.ozellik:first-child b{ color:#0066cc; font-weight:normal;}

.aciklama-item{padding:8px 0;border-bottom:1px solid #f9f9f9;font-family: Tahoma, sans-serif;}
.aciklama-item::before{content:"✔ ";color:#d4af37}

.ilan-konum iframe{width:100%;height:240px;border:0;border-radius:10px;margin-top:10px}

.slider-kapsul{
    position:relative;
}

.filigran{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) rotate(-28deg);

    font-family:Tahoma,sans-serif;
    font-size:28px;
    font-weight:bold;

    color:rgba(255,255,255,.16);
    text-shadow:0 2px 5px rgba(0,0,0,.45);

    white-space:nowrap;
    pointer-events:none;
    user-select:none;

    z-index:15;
}

.ust-bar{
    height:52px;
    background:#1b4d3e;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    position:sticky;
    top:0;
    z-index:9999;

    font-family:'Titillium Web',sans-serif;
    font-size:20px;
    font-weight:600;
}

.menu-btn{
    position:absolute;
    left:15px;
    font-size:24px;
    cursor:pointer;
    user-select:none;
}

.menu-panel{
    position:fixed;
    top:0;
    left:-260px;
    width:250px;
    height:100%;
    background:#fff;
    box-shadow:3px 0 15px rgba(0,0,0,.25);
    transition:.3s;
    z-index:999999;
    overflow:auto;
}

.menu-panel.acik{
    left:0;
}

.menu-header{
    background:#1b4d3e;
    color:#fff;
    padding:20px;
    font-family:'Titillium Web',sans-serif;
    font-size:22px;
    font-weight:600;
    letter-spacing:.5px;
}

.menu-link{
    display:flex;
    align-items:center;
    gap:12px;

    padding:18px 20px;

    color:#333;
    text-decoration:none;

    border-bottom:1px solid #ececec;

    font-family:'Titillium Web',sans-serif;
    font-size:20px;
    font-weight:600;

    transition:.25s;
}

.menu-link:hover{
    background:#f5f5f5;
    color:#1b4d3e;
}

.menu-kapat{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    display:none;
    z-index:999998;
}

.menu-kapat.acik{
    display:block;
}

.menu-link i{
    font-size:24px;
    width:30px;
    text-align:center;
}
.menu-site{
    color:#1976d2;
}

.menu-konum{
    color:#e53935;
}

.menu-paylas{
    color:#43a047;
    font-size:18px;
}

.header-sabit{
    position:sticky;
    top:52px;          /* .ust-bar yüksekliği */
    z-index:9998;

    background:#fff;

    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.share-btn{
    position:absolute;
    right:30px;
    font-size:22px;
    cursor:pointer;
    color:#fff;
	font-weight:200;
    transition:.25s;
}

.share-btn:hover{
    transform:scale(1.08);
}

.yetki-bilgi{
    margin-top:5px;
    font-family:inherit;
    font-size:inherit;
    font-weight:inherit;
}

.menu-link .fa-share-nodes{
    font-size:20px;
    color:#666;
    cursor:pointer;
    transition:.2s;
}

.menu-link .fa-share-nodes:hover{
    color:#1b4d3e;
}

</style>
</head>
<body>

<div id="acilisEkrani">
    <img src="logo.png" alt="NETmax Gayrimenkul">
    <h2>NETmax Gayrimenkul</h2>
    <p>İlan yükleniyor...</p>

    <div class="yukleme-kapsul">
        <div class="yukleme-cubuk"></div>
    </div>
</div>

<div class="ust-bar">

    <div class="menu-btn" onclick="menuAc()">☰</div>

    İLAN DETAYI

	<div class="share-btn" onclick="ilanPaylas()">
        <i class="fa-solid fa-share-nodes"></i>
    </div>

</div>

<div class="menu-panel" id="menuPanel">

    <div class="menu-header">
        NETmax Gayrimenkul
    </div>

<a href="https://netmaxgayrimenkul-ctrl.github.io/ilanlar-site/" class="menu-link">
    <i class="fa-solid fa-house menu-site"></i>
    <span>Sitemiz</span>
</a>

<a href="https://www.google.com/maps?q=NETmax+Gayrimenkul+Aksaray"
   target="_blank"
   class="menu-link">

    <i class="fa-solid fa-location-dot menu-konum"></i>

    <span style="flex:1;">Konumumuz</span>

    <i class="fa-solid fa-share-nodes menu-paylas"
       onclick="event.preventDefault();event.stopPropagation();konumPaylas();">
    </i>

</a>

</div>

<div class="menu-kapat" id="menuKapat" onclick="menuKapat()"></div>

<div id="ilanDetay" class="container"></div>

<script>
    let detayIndex = 0;
    const script = document.createElement('script');
    script.src = "js/ilanlar.js?t=" + new Date().getTime();
    script.onload = () => {
        const id = Number(new URLSearchParams(location.search).get("id"));
        const d = (typeof ilanlarVerisi !== 'undefined' ? ilanlarVerisi : []).find(x => x.id === id);
        if (d) {
            render(d);
            setTimeout(() => document.getElementById("acilisEkrani").style.display = "none", 2500);
        }
    };
    document.head.appendChild(script);

    function render(d) {

    let harita = "";
	let altBaslik = "";

	if (d.durum === "satilik") {
	    altBaslik = "SATILIK";
	} else if (d.durum === "kiralik") {
	    altBaslik = "KİRALIK";
	} else {
	    altBaslik = d.durum || "";
	}
	
	if (d.konutSekli) {
    altBaslik += " • " + d.konutSekli;
	} else if (d.konutTipi) {
	    altBaslik += " • " + d.konutTipi;
	} else if (d.tip) {
	    altBaslik += " • " + d.tip;
	}
	
	if (d["Oda Sayısı"]) {
	    altBaslik += " • " + d["Oda Sayısı"];
	}

    if(d.koor){
		    const koordinat = d.koor.split(",");
		    const lng = koordinat[0];
		    const lat = koordinat[1];
		
		    harita = `
		    <div class="ilan-konum">
		       
		        <iframe
		        src="https://maps.google.com/maps?q=${lat},${lng}&z=16&output=embed"
		        loading="lazy">
		        </iframe>
		    </div>`;
		}

    let aciklamaList = d.aciklama 
    ? d.aciklama.split(',').map(item => `<div class="aciklama-item">${item.trim()}</div>`).join('')
    : "Açıklama girilmemiştir.";

let yetkiHtml = "";

if (d.yetki && d.yetki.durum) {

    yetkiHtml = `
    <div class="yetki-bilgi">
        ✓ Yetkili İlan<br>
        Yetki No: ${d.yetki.yetkiNo}
    </div>
    `;

}

let ozellikler = "";

if(d.fiyat){
    ozellikler += row("Fiyat", d.fiyat + " " + (d.paraBirimi || ""));
}

    const gosterilecekler = [
        "İlan Tarihi",
        "M²",
        "Ada",
        "Parsel",
        "Oda Sayısı",
        "Bina Yaşı",
        "Bulunduğu Kat",
        "Kat Sayısı",
        "Isıtma",
        "Eşyalı mı",
        "Kullanım Durumu",
        "Site İçerisinde"
    ];

    gosterilecekler.forEach(key=>{
        if(d[key]) ozellikler += row(key,d[key]);
    });


    detayIndex = 0;

	let medyaHtml = d.resimler
    .map(r => `<img src="${r}" class="detay-resim">`)
    .join("");

if (Array.isArray(d.videoUrl)) {

    d.videoUrl.forEach(video => {
        medyaHtml += `
        <video class="detay-resim" controls playsinline preload="metadata">
            <source src="${video}" type="video/mp4">
        </video>
        `;
    });

} else if (typeof d.videoUrl === "string" && d.videoUrl.trim() !== "") {

    medyaHtml += `
    <video class="detay-resim" controls playsinline preload="metadata">
        <source src="${d.videoUrl}" type="video/mp4">
    </video>
    `;

}

const medyaSayisi =
    d.resimler.length +
    (Array.isArray(d.videoUrl)
        ? d.videoUrl.length
        : (typeof d.videoUrl === "string" && d.videoUrl.trim() !== "" ? 1 : 0));

    document.getElementById("ilanDetay").innerHTML = `

<div class="header-sabit">
    <div class="header-top">
        ${d.baslik || "İLAN DETAYI"}<br>
        ${altBaslik}
    </div>
</div>

    <div class="slider-kapsul">
	<div class="filigran" id="filigran">
        NETmax Gayrimenkul
    </div>

    <div class="detay-slider" id="slider">
        ${medyaHtml}
    </div>

    <button class="slider-btn" style="left:0" onclick="move(-1)">❮</button>
    <button class="slider-btn" style="right:0" onclick="move(1)">❯</button>


    <div class="resim-sayac" id="sayac">
         1 / ${medyaSayisi}
    </div>

</div>

	
    <div class="firma-imza">
        NETmax GAYRİMENKUL
		${yetkiHtml}

		<div id="yetkiQR"></div>
    </div>

    <div class="tabs">

        <button class="tab-btn active" onclick="openTab(event,'bilgi')">
        İlan Bilgileri
        </button>

        <button class="tab-btn" onclick="openTab(event,'aciklama')">
        Açıklama
        </button>

        <button class="tab-btn" onclick="openTab(event,'konum')">
		Konum
		</button>

    </div>


    <div id="bilgi" class="tab-content active">
        ${ozellikler}
    </div>

    <div id="aciklama" class="tab-content">
        ${aciklamaList}
    </div>

    <div id="konum" class="tab-content ilan-konum">
        ${harita}
    </div>

    `;


    sliderHazirla();

		if(d.yetki){

    const qrAlan = document.getElementById("yetkiQR");

    if(qrAlan){

        qrAlan.innerHTML = "";

        new QRCode(qrAlan, {
            text: "https://ademcolak68-debug.github.io/saha_ilanlar/yetki.html?id=" + d.id,
            width: 100,
            height: 100
        });

    }

}

}



function row(label,val){

    if(!val) return "";

    return `<div class="ozellik">
        <span>${label}</span>
        <span>${val}</span>
    </div>`;
}



function openTab(evt,id){

    document.querySelectorAll('.tab-content')
    .forEach(c=>c.classList.remove('active'));

    document.querySelectorAll('.tab-btn')
    .forEach(b=>b.classList.remove('active'));

    document.getElementById(id).classList.add('active');

    evt.currentTarget.classList.add('active');

}

function haritaTamEkran(){

    document.body.classList.add("harita-acik");

}

function sliderHazirla(){

    const slider=document.getElementById("slider");
    const sayac=document.getElementById("sayac");
    const resimler=document.querySelectorAll(".detay-resim");
    const filigran=document.getElementById("filigran");

    if(!slider || !sayac) return;

    function filigranDurumu(){

        const aktif = resimler[detayIndex];

        if(aktif && aktif.tagName==="VIDEO"){
            filigran.style.display="none";
        }else{
            filigran.style.display="block";
        }

    }

    filigranDurumu();

    slider.addEventListener("scroll",()=>{

        detayIndex=Math.round(slider.scrollLeft / slider.clientWidth);

        sayac.innerHTML=
        `${detayIndex+1} / ${resimler.length}`;

        filigranDurumu();

    });

}


function move(dir){

    const slider=document.getElementById("slider");
    const resimler=document.querySelectorAll(".detay-resim");

    detayIndex += dir;


    if(detayIndex < 0)
        detayIndex=resimler.length-1;


    if(detayIndex >= resimler.length)
        detayIndex=0;


    slider.scrollTo({
        left:detayIndex * slider.clientWidth,
        behavior:"smooth"
    });

}


function menuAc(){

    document.getElementById("menuPanel").classList.add("acik");

    document.getElementById("menuKapat").classList.add("acik");

}

function menuKapat(){

    document.getElementById("menuPanel").classList.remove("acik");

    document.getElementById("menuKapat").classList.remove("acik");

}

async function ilanPaylas(){

    const baslik = document.title;

    const metin = document.querySelector(".header-top").innerText;

    const link = window.location.href;

    if(navigator.share){

        try{

            await navigator.share({

                title: baslik,

                text: metin,

                url: link

            });

        }catch(e){}

    }else{

        navigator.clipboard.writeText(link);

        alert("İlan bağlantısı kopyalandı.");

    }

}

async function konumPaylas(){

    const url="https://www.google.com/maps?q=NETmax+Gayrimenkul+Aksaray";

    if(navigator.share){

        try{

            await navigator.share({
                title:"NETmax Gayrimenkul",
                text:"NETmax Gayrimenkul Konumu",
                url:url
            });

        }catch(e){}

    }else{

        navigator.clipboard.writeText(url);

        alert("Konum bağlantısı panoya kopyalandı.");

    }

}


</script>
</body>
</html>
