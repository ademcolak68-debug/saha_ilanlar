<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETmax Gayrimenkul</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
	
<style>
body{margin:0;background:#f4f4f4;font-family: Tahoma, sans-serif;color:#333}
.container{max-width:600px;margin:auto;background:#fff;min-height:100vh;padding-bottom:20px}

#acilisEkrani{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:99999;transition:opacity .5s}
#acilisEkrani img{width:230px;max-width:80%}
#acilisEkrani h2{margin-top:20px;font-size:24px;color:#1b4d3e}
#acilisEkrani p{margin-top:12px;color:#666;font-size:15px}
.yukleme-kapsul{width:220px;height:6px;background:#e5e5e5;border-radius:20px;overflow:hidden;margin-top:15px}
.yukleme-cubuk{width:0%;height:100%;background:#d4af37;animation:yukleAnimasyon 2.5s linear forwards}
@keyframes yukleAnimasyon{100%{width:100%}}

.header-top{padding:15px;font-size:16px;font-family: 'Titillium Web', sans-serif;text-align:center;border-bottom:1px solid #eee;text-transform:uppercase;line-height:1.4}
.firma-imza{font-size:14px;font-family: 'Titillium Web', sans-serif;font-weight:normal;text-align:center;padding:12px;background:#f9f9f9;border-bottom:1px solid #eee}
.firma-imza #yetkiQR{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:10px auto 0;
}

.firma-imza #yetkiQR canvas,
.firma-imza #yetkiQR img{
    display:block;
    margin:0 auto;
}
.slider-kapsul{position:relative}
.detay-slider{position:relative;width:100%;height:350px;background:#eee;overflow-x:auto;display:flex;scroll-snap-type:x mandatory}
.detay-resim{min-width:100%;height:100%;object-fit:contain;scroll-snap-align:start}

.slider-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);border:0;color:#fff;padding:15px 10px;cursor:pointer;font-size:22px;z-index:10;display:none}

.resim-sayac{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:4px 12px;border-radius:20px;font-size:13px}

@media(min-width:768px){.slider-btn{display:block}}

.tabs{display:flex;background:#eee;border-radius:8px;margin:15px;overflow:hidden}
.tab-btn{flex:1;padding:12px;border:0;background:#e0e0e0;cursor:pointer;font-weight:bold;color:#555;font-family: Tahoma, sans-serif;}
.tab-btn.active{background:#d4af37;color:#fff}
.tab-content{padding:0 15px;display:none;font-family: Tahoma, sans-serif;}
.tab-content.active{display:block}

.ozellik{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;font-family: Tahoma, sans-serif;}
.ozellik:first-child span,
.ozellik:first-child b{ color:#0066cc; font-weight:normal;}

.aciklama-item{padding:8px 0;border-bottom:1px solid #f9f9f9;font-family: Tahoma, sans-serif;}
.aciklama-item::before{content:"✔ ";color:#d4af37}

.ilan-konum iframe{width:100%;height:240px;border:0;border-radius:10px;margin-top:10px}
.ilan-konum {
    padding-bottom: 30px;
    box-sizing: border-box;
}
.slider-kapsul{
    position:relative;
}

.filigran{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) rotate(-28deg);

    font-family:Tahoma,sans-serif;
    font-size:28px;
    font-weight:bold;

    color:rgba(255,255,255,.16);
    text-shadow:0 2px 5px rgba(0,0,0,.45);

    white-space:nowrap;
    pointer-events:none;
    user-select:none;

    z-index:15;
}

.ust-bar{
    height:52px;
    background:#1b4d3e;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    position:sticky;
    top:0;
    z-index:9999;

    font-family:'Titillium Web',sans-serif;
    font-size:20px;
    font-weight:600;
}

.menu-btn{
    position:absolute;
    left:15px;
    font-size:24px;
    cursor:pointer;
    user-select:none;
}

.menu-panel{
    position:fixed;
    top:0;
    left:-260px;
    width:250px;
    height:100%;
    background:#fff;
    box-shadow:3px 0 15px rgba(0,0,0,.25);
    transition:.3s;
    z-index:999999;
    overflow:auto;
}

.menu-panel.acik{
    left:0;
}

.menu-header{
    background:#1b4d3e;
    color:#fff;
    padding:20px;
    font-family:'Titillium Web',sans-serif;
    font-size:22px;
    font-weight:600;
    letter-spacing:.5px;
}

.menu-link{
    display:flex;
    align-items:center;
    gap:12px;

    padding:18px 20px;

    color:#333;
    text-decoration:none;

    border-bottom:1px solid #ececec;

    font-family:'Titillium Web',sans-serif;
    font-size:20px;
    font-weight:600;

    transition:.25s;
}

.menu-link:hover{
    background:#f5f5f5;
    color:#1b4d3e;
}

.menu-kapat{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    display:none;
    z-index:999998;
}

.menu-kapat.acik{
    display:block;
}

.menu-link i{
    font-size:24px;
    width:30px;
    text-align:center;
}
.menu-site{
    color:#1976d2;
}

.menu-konum{
    color:#e53935;
}

.menu-paylas{
    color:#43a047;
    font-size:18px;
}

.header-sabit{
    position:sticky;
    top:52px;
    z-index:9998;

    background:#fff;

    box-shadow:0 2px 8px rgba(0,0,0,.08);

    overflow:hidden;
}

.share-btn{
    position:absolute;
    right:65px;
    font-size:22px;
    cursor:pointer;
    color:#fff;
	font-weight:200;
    transition:.25s;
}

.share-btn:hover{
    transform:scale(1.08);
}

.yetki-bilgi{
    margin-top:5px;
    font-family:inherit;
    font-size:inherit;
    font-weight:inherit;
}

.menu-link .fa-share-nodes{
    font-size:20px;
    color:#666;
    cursor:pointer;
    transition:.2s;
}

.menu-link .fa-share-nodes:hover{
    color:#1b4d3e;
}

.ilanlar-panel{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#fff;
z-index:999999;
display:none;
overflow:auto;
}
.ilanlar-panel::-webkit-scrollbar{
    width:8px;
}

.ilanlar-panel::-webkit-scrollbar-track{
    background:#f1f1f1;
}

.ilanlar-panel::-webkit-scrollbar-thumb{
    background:#1b4d3e;
    border-radius:10px;
}

.ilanlar-panel::-webkit-scrollbar-thumb:hover{
    background:#d4af37;
}

.ilanlar-panel.acik{
display:block;
}

.ilanlar-ust{
height:52px;
background:#1b4d3e;
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
font-family:'Titillium Web',sans-serif;
font-size:22px;
font-weight:600;
}

.ilanlar-ust i{
font-size:28px;
cursor:pointer;
}

.ilan-kart{
display:flex;
gap:12px;
padding:12px;
border-bottom:1px solid #eee;
cursor:pointer;
background:#fff;
}

.ilan-kart img{
width:110px;
height:80px;
object-fit:cover;
border-radius:8px;
}

.ilan-kart-bilgi{
flex:1;
font-family:Tahoma,sans-serif;
}

.ilan-kart-baslik{
background:#1b4d3e;
color:#fff;
padding:8px 10px;
border-radius:6px;
font-family:Tahoma,sans-serif;
font-size:14px;
font-weight:bold;
line-height:1.4;
margin-bottom:8px;
}

.ilan-kart-fiyat{
color:#238ca8;
font-weight:bold;
}

.diger-ilanlar-btn{
    position:absolute;
    right:25px;
    font-size:22px;
    cursor:pointer;
    color:#fff;
    transition:.25s;
}
.diger-ilanlar-btn:hover{
    transform:scale(1.08);
}

/* =========================================
   İLAN KATEGORİ ALANI
   ========================================= */

.ilan-kategori-listesi{
    width:100%;
    max-width:700px;
    margin:0 auto;
    padding:15px 12px 40px;
    box-sizing:border-box;
    font-family:Tahoma,sans-serif !important;
}


/* =========================================
   SATILIK / KİRALIK ANA BAŞLIK
========================================= */

.ana-ilan-kategori{
    width:100%;
    min-height:52px;

    display:flex;
    align-items:center;

    box-sizing:border-box;

    padding:0 18px;
    margin-bottom:7px;

    border:1px solid rgba(255,255,255,.25);
    border-radius:10px;

    color:#fff !important;

    font-family:Tahoma,sans-serif !important;
    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 3px 10px rgba(0,0,0,.15);

    transition:
        background .25s ease,
        transform .2s ease,
        box-shadow .25s ease;
}


/* SATILIK */

.ana-ilan-kategori.satilik{
    background:linear-gradient(
        135deg,
        #8b2635,
        #b83245
    );
}


/* KİRALIK */

.ana-ilan-kategori.kiralik{
    background:linear-gradient(
        135deg,
        #176b87,
        #238ca8
    );
}


/* ANA BAŞLIK YAZISI */

.ana-ilan-kategori span{
    display:block;
    width:100%;

    color:#fff !important;

    font-family:Tahoma,sans-serif !important;
    font-size:16px;
    font-weight:bold;
}


/* HOVER */

.ana-ilan-kategori:hover{
    filter:brightness(1.08);

    box-shadow:
        0 5px 14px rgba(0,0,0,.22);
}


/* BASMA */

.ana-ilan-kategori:active{
    transform:scale(.985);
}


/* =========================================
   ALT KATEGORİ ALANI
========================================= */

.alt-kategori-listesi{
    margin:0 0 12px 0;
    padding:4px 0 5px 14px;

    font-family:Tahoma,sans-serif !important;
}


/* =========================================
   ALT KATEGORİ
========================================= */

.alt-ilan-kategori{
    min-height:43px;

    display:flex;
    align-items:center;

    padding:0 15px;

    margin-bottom:5px;

    box-sizing:border-box;

    background:#f5f6f8;

    border:1px solid #e1e4e8;
    border-left:4px solid #8b2635;

    border-radius:7px;

    color:#333 !important;

    font-family:Tahoma,sans-serif !important;
    font-size:14px;
    font-weight:bold;

    cursor:pointer;

    transition:
        background .2s ease,
        color .2s ease,
        border-color .2s ease,
        padding-left .2s ease,
        box-shadow .2s ease;
}


/* ALT KATEGORİ YAZISI */

.alt-ilan-kategori span{
    color:#333 !important;

    font-family:Tahoma,sans-serif !important;
    font-size:14px;
    font-weight:bold;
}


/* =========================================
   SATILIK ALT KATEGORİLER
========================================= */

.ilan-kategori-listesi
.ana-ilan-kategori.satilik
+ .alt-kategori-listesi
.alt-ilan-kategori{

    border-left-color:#b83245;
}


/* SATILIK HOVER */

.ilan-kategori-listesi
.ana-ilan-kategori.satilik
+ .alt-kategori-listesi
.alt-ilan-kategori:hover{

    background:#fff1f3;
    color:#a52638 !important;
    border-left-color:#b83245;
}


/* SATILIK YAZI HOVER */

.ilan-kategori-listesi
.ana-ilan-kategori.satilik
+ .alt-kategori-listesi
.alt-ilan-kategori:hover span{

    color:#a52638 !important;
}


/* =========================================
   KİRALIK ALT KATEGORİLER
========================================= */

.ilan-kategori-listesi
.ana-ilan-kategori.kiralik
+ .alt-kategori-listesi
.alt-ilan-kategori{

    border-left-color:#238ca8;
}


/* KİRALIK HOVER */

.ilan-kategori-listesi
.ana-ilan-kategori.kiralik
+ .alt-kategori-listesi
.alt-ilan-kategori:hover{

    background:#edfafd;
    color:#176b87 !important;
    border-left-color:#176b87;
}


/* KİRALIK YAZI HOVER */

.ilan-kategori-listesi
.ana-ilan-kategori.kiralik
+ .alt-kategori-listesi
.alt-ilan-kategori:hover span{

    color:#176b87 !important;
}


/* =========================================
   ALT KATEGORİ GENEL HOVER
========================================= */

.alt-ilan-kategori:hover{
    padding-left:19px;
    box-shadow:
        0 3px 8px rgba(0,0,0,.10);
}


/* =========================================
   ALT KATEGORİ İKONU
========================================= */

.alt-ilan-kategori i{
    margin-right:10px;
    font-size:11px;
    color:#8b2635;
}


/* =========================================
   İLAN KARTLARI
========================================= */

.kategori-ilanlari{
    padding:4px 0 10px 10px;
    font-family:Tahoma,sans-serif !important;
}


.kategori-ilanlari *{

    font-family:Tahoma,sans-serif !important;
}

/* =========================================
   KAT KARŞILIĞI ANA KATEGORİ
   ========================================= */

.ana-ilan-kategori.kat-karsiligi{
    background:linear-gradient(
        135deg,
        #8a6418,
        #b88b29
    );
}

/* KAT KARŞILIĞI ANA YAZI */

.ana-ilan-kategori.kat-karsiligi span{
    color:#fff !important;
}

/* =========================================
   KAT KARŞILIĞI ALT KATEGORİLER
   ========================================= */

.ilan-kategori-listesi
.ana-ilan-kategori.kat-karsiligi
+ .alt-kategori-listesi
.alt-ilan-kategori{

    border-left-color:#b88b29;
}

/* KAT KARŞILIĞI ALT HOVER */

.ilan-kategori-listesi
.ana-ilan-kategori.kat-karsiligi
+ .alt-kategori-listesi
.alt-ilan-kategori:hover{

    background:#fff8e6;
    color:#8a6418 !important;
    border-left-color:#8a6418;
}

/* KAT KARŞILIĞI ALT YAZI HOVER */

.ilan-kategori-listesi
.ana-ilan-kategori.kat-karsiligi
+ .alt-kategori-listesi
.alt-ilan-kategori:hover span{

    color:#8a6418 !important;
}


/* =========================================
   MOBİL
========================================= */

@media(max-width:600px){

    .ilan-kategori-listesi{
        padding:
            12px 9px 35px;
    }

    .ana-ilan-kategori{
        min-height:50px;
        padding:0 15px;
        font-size:15px;
        border-radius:9px;
    }

    .ana-ilan-kategori span{
        font-size:15px;
    }

    .alt-kategori-listesi{
        padding-left:9px;
    }

    .alt-ilan-kategori{
        min-height:42px;
        padding:0 13px;
        font-size:14px;
    }

    .alt-ilan-kategori span{
        font-size:14px;
    }

    .kategori-ilanlari{
        padding-left:4px;
    }

}

/* =========================================
   DİĞER İLANLAR BİLGİ BALONU
========================================= */

.diger-ilanlar-bilgi{
    position:fixed;

    top:44px;
    right:10px;

    background:#1976d2;
    color:#fff;

    padding:7px 11px;

    border-radius:6px;

    font-family:Tahoma,sans-serif;
    font-size:12px;
    font-weight:bold;

    white-space:nowrap;

    z-index:100000;

    box-shadow:0 3px 10px rgba(0,0,0,.25);

    opacity:0;
    visibility:hidden;

    transform:translateY(-5px);

    transition:
        opacity .3s ease,
        transform .3s ease,
        visibility .3s ease;
}


/* ÜSTTEKİ OK */

.diger-ilanlar-bilgi::before{
    content:"";

    position:absolute;

    top:-7px;
    right:17px;

    width:0;
    height:0;

    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-bottom:7px solid #1976d2;
}


/* GÖSTER */

.diger-ilanlar-bilgi.goster{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}

.alt-ilan-kategori{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    opacity:0.7;
}

.alt-ilan-kategori > span:first-child{
    width:70px;
}

.kategori-adet{
    margin-left:10px;
    width:25px;
    text-align:left;
    font-size:12px;
    opacity:0.7;
}

.danisman-butonlari {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 20px;

    padding: 7px 12px;
    box-sizing: border-box;

    background: white;
    z-index: 9999;
}

.danisman-butonlari button {
    flex: 0 0 150px;
    width: 150px;
    box-sizing: border-box;

    border: none;
    border-radius: 6px;

    background: #2563eb;
    color: white;

    font-size: 15px;
    font-family: 'Titillium Web', sans-serif;
    font-weight: bold;

    padding: 10px 5px;

    cursor: pointer;
}

.danisman-butonlari button:active {
    transform: scale(0.98);
}
	
</style>
</head>
<body>

<div id="acilisEkrani">
    <img src="logo.png" alt="NETmax Gayrimenkul">
    <h2>NETmax Gayrimenkul</h2>
    <p>İlan yükleniyor...</p>

    <div class="yukleme-kapsul">
        <div class="yukleme-cubuk"></div>
    </div>
</div>

<div class="ust-bar">

    <div class="menu-btn" onclick="menuAc()">☰</div>

    İLAN DETAYI

	<div class="share-btn" onclick="ilanPaylas()">
        <i class="fa-solid fa-share-nodes"></i>
    </div>
		<div class="diger-ilanlar-btn" onclick="ilanlariAc()">
	    <i class="fa-solid fa-building"></i>
	</div>

</div>

<div id="digerIlanlarBilgi"
     class="diger-ilanlar-bilgi">

    Diğer İlanlarımız için tıklayın

</div>

<div class="menu-panel" id="menuPanel">

    <div class="menu-header">
        NETmax Gayrimenkul
    </div>

<a href="https://netmaxgayrimenkul-ctrl.github.io/ilanlar-site/" class="menu-link">
    <i class="fa-solid fa-house menu-site"></i>
    <span>Sitemiz</span>
</a>

<a href="https://www.google.com/maps?q=NETmax+Gayrimenkul+Aksaray"
   target="_blank"
   class="menu-link">

    <i class="fa-solid fa-location-dot menu-konum"></i>

    <span style="flex:1;">Konumumuz</span>

    <i class="fa-solid fa-share-nodes menu-paylas"
       onclick="event.preventDefault();event.stopPropagation();konumPaylas();">
    </i>

</a>

<a href="#" class="menu-link" onclick="event.preventDefault();ilanlariAc();">

    <i class="fa-solid fa-building"></i>

    <span style="flex:1;">İlanlarımız</span>

</a>

<a href="#"
   class="menu-link"
   onclick="event.preventDefault();mesajlarimiAc();">

    <i class="fa-solid fa-comments"></i>

    <span style="flex:1;">
        Mesajlarım
    </span>

    <span
        id="mesajBildirim"
        style="
            display:none;
            font-size:12px;
            color:#2563eb;
            margin-left:auto;
            margin-right:8px;
            white-space:nowrap;
        ">
    </span>

</a>

</div>

<div class="menu-kapat" id="menuKapat" onclick="menuKapat()"></div>

<div id="ilanDetay" class="container"></div>

<div id="ilanlarPanel" class="ilanlar-panel">

    <div class="ilanlar-ust">
        <span>İlanlarımız</span>

        <i class="fa-solid fa-xmark"
           onclick="ilanlarKapat()">
        </i>
    </div>

</div>

<script>
	
	
    let detayIndex = 0;

	const danismanScript = document.createElement('script');
	danismanScript.src = "js/danismanlar.js?t=" + new Date().getTime();
	
	danismanScript.onload = () => {
	
	    const script = document.createElement('script');
	    script.src = "js/ilanlar.js?t=" + new Date().getTime();
	
	    script.onload = () => {
	
	        const id = Number(
	            new URLSearchParams(location.search).get("id")
	        );
	
	        const d =
	            (typeof ilanlarVerisi !== 'undefined'
	                ? ilanlarVerisi
	                : []
	            ).find(x => x.id === id);
	
	        if (d) {
	
	            render(d);
	
	            setTimeout(() =>
	                document.getElementById("acilisEkrani").style.display = "none",
	                2500
	            );
	
	        }
	
	    };
	
	    document.head.appendChild(script);
	
	};
	
	document.head.appendChild(danismanScript);

    function render(d) {

    let harita = "";
	let altBaslik = "";

	if (d.durum === "satilik") {
	    altBaslik = "SATILIK";
	} else if (d.durum === "kiralik") {
	    altBaslik = "KİRALIK";
	} else {

function row(label,val){

    if(!val) return "";

    return `<div class="ozellik">
        <span>${label}</span>
        <span>${val}</span>
    </div>`;
}



function openTab(evt,id){

    document.querySelectorAll('.tab-content')
    .forEach(c=>c.classList.remove('active'));

    document.querySelectorAll('.tab-btn')
    .forEach(b=>b.classList.remove('active'));

    document.getElementById(id).classList.add('active');

    evt.currentTarget.classList.add('active');

}

function sliderHazirla(){

    const slider=document.getElementById("slider");
    const sayac=document.getElementById("sayac");
    const resimler=document.querySelectorAll(".detay-resim");
    const filigran=document.getElementById("filigran");

    if(!slider || !sayac) return;

    function filigranDurumu(){

        const aktif = resimler[detayIndex];

        if(aktif && aktif.tagName==="VIDEO"){
            filigran.style.display="none";
        }else{
            filigran.style.display="block";
        }

    }

    filigranDurumu();

    slider.addEventListener("scroll",()=>{

        detayIndex=Math.round(slider.scrollLeft / slider.clientWidth);

        sayac.innerHTML=
        `${detayIndex+1} / ${resimler.length}`;

        filigranDurumu();

    });

}


function move(dir){

    const slider=document.getElementById("slider");
    const resimler=document.querySelectorAll(".detay-resim");

    detayIndex += dir;


    if(detayIndex < 0)
        detayIndex=resimler.length-1;


    if(detayIndex >= resimler.length)
        detayIndex=0;


    slider.scrollTo({
        left:detayIndex * slider.clientWidth,
        behavior:"smooth"
    });

}

        );

      }
    );


  /*
  =====================================================
  BURGER MESAJ SAYISI
  =====================================================
  */

  function mesajBildiriminiGoster() {

    console.log(
      "BURGER FONKSİYONU ÇAĞRILDI"
    );


    const bildirim =
      document.getElementById(
        "mesajBildirim"
      );


    if (!bildirim) {

      console.log(
        "mesajBildirim bulunamadı."
      );

      return;

    }


    const bildirimRef =
      ref(
        database,
        "bildirimSayaci"
      );


    onValue(

      bildirimRef,

      (snapshot) => {

        const veri =
          snapshot.val() || {};


        const toplam =
          Number(
            veri.okunmamis || 0
          );


        console.log(
          "BURGER MESAJ SAYISI:",
          toplam
        );


        if (
          toplam > 0
        ) {

          bildirim.style.display =
            "block";


          bildirim.textContent =
            toplam +
            " yeni mesaj";

        }

        else {

          bildirim.style.display =
            "none";


          bildirim.textContent =
            "";

        }

      }

    );

  }

</script>
